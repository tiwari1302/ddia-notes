ext position to read).", "why": "Decouples throughput from producers; enables pause/replay."}, {"term": "Change Data Capture (CDC)", "def": "Extract a stream of changes from a database's transaction log and publish them as events. Downstream systems (search index, cache, warehouse) consume and stay in sync.", "why": "Makes a DB a source of truth with a derived-data fanout. Avoids dual writes (writing to DB and Kafka separately, which can diverge).", "ex": "Debezium, LinkedIn Databus, AWS DMS."}, {"term": "Event sourcing", "def": "Design pattern: instead of storing current state, store the sequence of events that produced it. Current state is derived by replaying events.", "why": "Full audit log, easy to rebuild state with new logic, natural fit for streaming. Cost: querying \"current state\" requires either replay or a materialized view."}, {"term": "Dual writes problem", "def": "Writing to two systems (DB + Kafka, or DB + search index) non-atomically. If one succeeds and the other fails, they diverge.", "why": "Fundamental reason to prefer CDC or event sourcing: only write to one place; derive others from it."}, {"term": "Stream-stream join", "def": "Join two streams over a time window: for each event in A, find matching events in B within the window.", "why": "Example: match click events to impression events within 5 minutes. Needs bounded state; late events are a pain."}, {"term": "Stream-table join", "def": "Join a stream against a relatively static table (materialized in the stream processor). Each stream event looks up the table.", "why": "Enriching events with dimension data (user attributes, product info). Common and fast; the table is kept updated by CDC."}, {"term": "Table-table join", "def": "Keep two tables as materialized views maintained by streams; joined result is another materialized view.", "why": "Whole system becomes derived views of streams &mdash; similar to a streaming SQL engine (kSQL, Flink SQL, Materialize)."}, {"term": "Event time vs processing time", "def": "<strong>Event time</strong>: when the event actually happened (producer timestamp). <strong>Processing time</strong>: when the stream processor saw it.", "why": "Events arrive out of order or late; computing \"events per minute\" on processing time is wrong under backpressure or multi-region data. Use event time for correctness.", "ex": "Mobile phone goes offline all day &rarr; all events arrive at 8pm &mdash; processing-time metrics would be meaningless."}, {"term": "Windowing", "def": "Grouping events into finite windows for aggregation. Types: <strong>tumbling</strong> (non-overlapping fixed windows), <strong>hopping/sliding</strong> (overlapping), <strong>session</strong> (activity-bounded).", "why": "Unbounded streams can't be aggregated in total; windows define the aggregation unit."}, {"term": "Watermark", "def": "An assertion that no more events with event-time &lt; T will arrive. Lets the processor close windows confidently.", "why": "Balances latency vs completeness. Too tight = miss late events; too loose = high latency."}, {"term": "Exactly-once semantics", "def": "Each event's effect is applied exactly once despite failures. Achieved via <strong>idempotence</strong> + <strong>transactional writes</strong> + <strong>checkpoints</strong>, not by magic.", "why": "Naive retry gives at-least-once (duplicates); exactly-once requires deduplication or idempotent operations. Flink's checkpointed state + transactional sinks is a canonical implementation."}, {"term": "Stateful stream processing", "def": "Processors hold state (counters, joins, session info) between events. State must survive failures via checkpointing.", "why": "Most interesting stream processing is stateful. Fault tolerance of state is the hard part.", "ex": "Flink's distributed snapshots (Chandy-Lamport), Kafka Streams' state stores."}], "cheatsheet": [{"title": "AMQP vs Log-based brokers", "type": "table", "headers": ["", "AMQP/JMS (RabbitMQ)", "Log-based (Kafka)"], "rows": [["Storage", "Transient; delete on ack", "Durable log; retain for days/forever"], ["Replay", "No (once consumed, gone)", "Yes (rewind offsets)"], ["Ordering", "Limited", "Strict within partition"], ["Multiple independent consumers", "Awkward (fanout exchange)", "Natural (consumer groups)"], ["Best for", "Task queues, RPC buffers", "Event streams, replayable history"], ["Throughput", "Lower; limited by queue depth", "Very high (sequential writes)"]]}, {"title": "CDC vs Event Sourcing", "type": "table", "headers": ["", "CDC", "Event Sourcing"], "rows": [["Source of truth", "The DB", "The event log"], ["How events are produced", "Captured from DB's WAL", "Produced by the application"], ["Granularity", "Row-level changes", "Business-level events (\"OrderPlaced\")"], ["Typical use", "Stay-in-sync (search index, cache)", "Audit, replay with new logic, domain modeling"]]}, {"title": "Stream join types", "type": "table", "headers": ["Type", "Example", "State needed"], "rows": [["Stream-stream", "Match click to impression within 5m", "Bounded window state"], ["Stream-table", "Enrich event with user profile", "Materialized table, kept current by CDC"], ["Table-table", "Continuously-updated derived table", "Both tables materialized"]]}, {"title": "Windowing types", "type": "list", "items": ["<strong>Tumbling</strong>: non-overlapping fixed windows (every 1 min)", "<strong>Hopping / sliding</strong>: overlapping windows (every 10s, 1 min long)", "<strong>Session</strong>: bounded by inactivity (close after 30 min gap)", "Use <strong>event time</strong> + <strong>watermarks</strong> for correctness with late data"]}, {"title": "Achieving exactly-once", "type": "list", "items": ["<strong>Idempotent writes</strong>: same input produces same output; retries are safe (most common pattern)", "<strong>Deduplication</strong>: track processed message IDs", "<strong>Transactional sink</strong>: write output + commit offset atomically (Kafka transactions)", "<strong>Checkpointed state</strong>: periodically snapshot; on failure, restore and replay from snapshot", "End-to-end exactly-once requires: idempotent producer + transactional processing + idempotent sink"]}], "interview": [{"q": "What's the difference between a traditional message broker and Kafka?", "diff": "medium", "a": "<p><strong>Traditional (AMQP/JMS)</strong>: messages are ephemeral. Once a consumer acks, they're deleted. Low latency but no replay, limited ordering, awkward for multiple consumer types.</p><p><strong>Kafka (log-based)</strong>: messages are appended to a durable, partitioned log. Consumers track their own offset; broker doesn't delete on read. Multiple independent consumer groups can read the same topic at different speeds. Replay is trivial (reset offsets).</p><p>Kafka is better when:</p><ul><li>You want multiple independent consumers (analytics + search + cache).</li><li>You want replay (bug fix &rarr; reprocess a week of events).</li><li>You need strict per-key ordering (use the key as partition key).</li><li>Throughput matters (Kafka is optimized for sequential writes).</li></ul><p>Traditional brokers still make sense for transient task queues and low-volume RPC-like messaging.</p>"}, {"q": "Explain CDC (change data capture) and what problem it solves.", "diff": "medium", "a": "<p>CDC extracts a stream of changes from a database's transaction log and publishes them as events. Downstream systems (search index, cache, analytics warehouse, other microservices) subscribe and stay in sync.</p><p>Problem it solves: the <strong>dual writes problem</strong>. Naively you write to the DB AND publish to Kafka AND update the search index. If any one fails, they diverge. CDC makes the DB the single source of truth; everything else is derived.</p><p>Implementations: Debezium (Postgres WAL, MySQL binlog), LinkedIn Databus, AWS DMS. Schema evolves via Avro and a schema registry.</p>"}, {"q": "What is event sourcing and how does it differ from CDC?", "diff": "hard", "a": "<p>Both produce an event log as source of truth, but:</p><ul><li><strong>CDC</strong> captures database row-level changes. Events are low-level (\"row X column Y changed to Z\"). The DB is primary; events are a stream of its changes.</li><li><strong>Event sourcing</strong> inverts it: the <em>event log is the source of truth</em>. The application emits <em>domain events</em> (\"OrderPlaced\", \"PaymentReceived\"). Current state is a materialized view built by replaying events.</li></ul><p>Event sourcing benefits: full audit, natural fit for business logic changes (replay with new rules), and aligns with event-driven microservices. Cost: querying current state requires a separate materialized view.</p><p>You can combine: event-sourced writes, then CDC/stream pushes those events into query-optimized views (a pattern called CQRS).</p>"}, {"q": "Why is event time preferred over processing time for analytics?", "diff": "medium", "a": "<p>Processing time (\"when my processor saw it\") is cheap but wrong when events are late or out of order:</p><ul><li>Mobile phone offline all day &rarr; all events arrive at 8pm &mdash; a \"events per minute\" metric would spike impossibly at 8pm.</li><li>Network backpressure delays events &mdash; graph appears to show a lull then a spike.</li></ul><p>Event time (\"when the event actually happened\") gives true business-meaningful metrics regardless of how the pipeline behaves.</p><p>The cost of event time: you must wait for late events, or accept incompleteness. This is what <strong>watermarks</strong> are for &mdash; they declare \"we don't expect more events older than T\" so windows can be finalized with bounded latency.</p>"}, {"q": "Explain the three types of stream joins.", "diff": "hard", "a": "<p><strong>Stream-stream join</strong>: match events from two streams within a time window. Example: join clicks to impressions within 5 minutes. State: bounded by window size; events outside window are evicted.</p><p><strong>Stream-table join</strong>: each event looks up a (relatively static) table. The processor keeps the table materialized locally, updated via CDC. Example: enrich a page-view event with the user's country and signup date. State: full table, continuously updated.</p><p><strong>Table-table join</strong>: both inputs are streams representing tables; the join produces a third continuously-updated table. Example: combine an \"active users\" table with a \"user preferences\" table. State: both tables. This is what streaming SQL engines do.</p><p>Hard parts: out-of-order events, late updates, exactly-once semantics.</p>"}, {"q": "How do you achieve exactly-once semantics in stream processing?", "diff": "hard", "a": "<p>It's not free magic &mdash; it's engineering. Three ingredients:</p><ol><li><strong>Idempotent operations</strong>: if you apply the same event twice, the outcome is the same. Typically via unique IDs or deterministic keys.</li><li><strong>Transactional / atomic writes</strong>: commit processed output AND the new consumer offset together. If the write fails, the offset doesn't advance. Kafka's transactional producer + consumer offset commits does exactly this.</li><li><strong>Checkpointed state</strong>: the processor periodically snapshots its state. On failure, it restores from the last snapshot and replays from there (assuming idempotence makes re-processing safe).</li></ol><p>Flink's <strong>distributed snapshots</strong> (Chandy-Lamport algorithm) is the canonical implementation. Kafka Streams + Kafka transactions is another common pattern.</p><p>End-to-end exactly-once also needs an <strong>idempotent sink</strong> (e.g., writes with unique keys, or upserts).</p>"}, {"q": "What is a watermark in stream processing?", "diff": "medium", "a": "<p>A watermark is a signal that says: \"I don't expect any more events with event-time earlier than T.\" It flows through the pipeline as a marker, letting each operator know it can safely finalize any window that ends before T.</p><p>Tradeoff:</p><ul><li>Tight watermark (little patience for late events): low latency, but some events get dropped/excluded.</li><li>Loose watermark (long patience): better completeness, but windows are held open longer, higher latency.</li></ul><p>Typically derived heuristically from observed event times: \"watermark = max event time seen - 30 seconds\".</p>"}, {"q": "Design a pipeline to keep a search index in sync with a database.", "diff": "hard", "a": "<p>Two options, both building on CDC:</p><ol><li><strong>CDC &rarr; stream processor &rarr; search index</strong>: Debezium reads the DB's WAL and publishes row changes to Kafka. A Kafka Streams (or Flink) job consumes, joins with reference data if needed, and writes to Elasticsearch with idempotent upserts keyed on the primary key. On failure, rewind and replay.</li><li><strong>CDC &rarr; direct sink</strong>: for simple cases, use Kafka Connect with an Elasticsearch sink connector. No custom code.</li></ol><p>Points to call out:</p><ul><li>Source of truth is the DB; no dual writes.</li><li>Idempotent writes to ES (upsert by ID) means retries are safe.</li><li>Offsets tracked, so failures just replay from last committed offset.</li><li>Schema evolution handled by Avro + Schema Registry.</li><li>Backfill: run a one-time batch to seed from a DB snapshot, then switch over to the CDC stream at the right LSN.</li></ul>"}]}, {"id": "ch12", "part": 3, "number": 12, "title": "The Future of Data Systems", "overview": "<p>The synthesis chapter. Kleppmann argues for a unified architecture: a durable log of events is the source of truth, and every other data store (DBs, search indexes, caches, warehouses) is a <strong>derived</strong> materialized view, kept in sync by stream processors. This is the <strong>unbundled database</strong>.</p><p>Covers the Lambda vs Kappa architecture debate, correctness via the end-to-end principle, enforcing constraints with idempotent streams, and ethics: predictive analytics, bias, privacy, and surveillance capitalism.</p>", "concepts": [{"term": "Unbundling the database", "def": "A DB is really several things in one box: storage engine, index, replication log, query planner, transaction manager. The \"unbundled\" vision: separate them as services, with a durable log as the backbone and specialized stores as derived views.", "why": "Each use case gets the best tool; integration by stream instead of dual-writes."}, {"term": "Source of truth = immutable log", "def": "All changes as events in an append-only log (Kafka). Other stores (search index, cache, warehouse) are materialized views of this log.", "why": "Single source avoids dual-write divergence; replaying the log can rebuild any view; old logic can be retrofitted via new consumers."}, {"term": "Derived data", "def": "Any store downstream of the source-of-truth log: search indexes, caches, summary tables, ML features. They can be wiped and rebuilt from the log.", "why": "Implicit in the above. Helps reason about staleness: \"all derived stores are snapshots of the log, possibly stale by X seconds.\""}, {"term": "Lambda architecture", "def": "Separate <strong>batch</strong> and <strong>stream</strong> processing paths: batch produces correct, complete results at high latency; stream produces fast, approximate results. Queries merge them.", "why": "Proposed by Nathan Marz. Downsides: maintaining two code paths doubles bug surface and operational load."}, {"term": "Kappa architecture", "def": "Only the stream path, with strong guarantees. To reprocess historical data, rewind the log and run the same code on it. Simpler.", "why": "Possible once stream processors became robust enough (Flink, Kafka Streams). Preferred by Kleppmann."}, {"term": "End-to-end argument", "def": "Certain correctness properties (e.g., dedup, idempotence) can only be achieved at the <em>application</em> level, not at any intermediate layer.", "why": "Even \"exactly-once\" infrastructure requires app-level idempotence to survive upstream bugs or retries. Don't delegate correctness wholesale."}, {"term": "Enforcing constraints on streams", "def": "Stream processors can enforce uniqueness, inventory invariants, etc. by routing operations on the same key to the same partition and using per-partition sequential processing.", "why": "You don't need distributed transactions for many constraints if you can partition the work."}, {"term": "Timeliness vs integrity", "def": "<strong>Timeliness</strong>: results are recent (low staleness). <strong>Integrity</strong>: results are correct (no lost/duplicated data).", "why": "They trade off. Integrity is non-negotiable; timeliness can be relaxed for many use cases. Kleppmann: prioritize integrity and be honest about staleness."}, {"term": "Idempotence via operation IDs", "def": "Attach a unique ID to each operation; downstream stores dedupe by ID. Enables safe retries without risk of double-counting.", "why": "Foundational pattern for building reliable systems on top of at-least-once delivery."}, {"term": "Trust but verify (auditability)", "def": "Even carefully built systems have bugs. Periodically audit derived data against the source log: reconcile sums, counts, check invariants.", "why": "Catches silent corruption and integration bugs that monitoring misses. Accountants have been doing this for centuries."}, {"term": "Predictive analytics", "def": "Using data to predict individual outcomes (credit, insurance, hiring). Powerful, but models can encode bias and cause unjust automated decisions at scale.", "why": "Kleppmann warns that a model can appear neutral but systematically disadvantage groups (redlining-by-algorithm)."}, {"term": "Surveillance capitalism / privacy", "def": "Data collected as a byproduct of services (search, email, location) is used to predict behavior and influence users. The scale of collection is new.", "why": "Ethical concern: users don't meaningfully consent, data leaks are catastrophic, and aggregated data reveals things individuals didn't intend to share."}, {"term": "Feedback loops in data-driven decisions", "def": "Automated decisions alter the data they're trained on: predict someone is high-risk &rarr; deny them credit &rarr; their credit history worsens &rarr; model confirms its own prediction.", "why": "Systems can self-reinforce biases. Requires deliberate audit, counterfactual reasoning, and humility about model outputs."}, {"term": "Data integration", "def": "The messy practical problem: multiple systems, each with partial data, must be kept consistent. Kleppmann's prescription: use a log as the integration backbone.", "why": "Ultimately the chapter is about making data integration easier by accepting streams as the universal interchange."}], "cheatsheet": [{"title": "Lambda vs Kappa architecture", "type": "table", "headers": ["", "Lambda", "Kappa"], "rows": [["Paths", "Batch + stream (two code paths)", "Stream only"], ["Rebuild from history", "Via the batch pipeline", "Replay the log"], ["Operational complexity", "High (two pipelines to maintain)", "Lower"], ["Latency", "Stream: fast (approximate); Batch: slow (correct)", "Stream: fast + eventually consistent"], ["Proposed by", "Nathan Marz", "Jay Kreps (LinkedIn/Confluent)"]]}, {"title": "The 'unbundled database' pattern", "type": "list", "items": ["Durable log (Kafka) is the source of truth", "OLTP DB is one consumer (or the primary via CDC)", "Search index, cache, analytics warehouse are derived views", "Each view rebuildable by replaying the log", "Stream processors keep views in sync", "Adding a new view = add a new consumer; backfill by replaying"]}, {"title": "Correctness principles", "type": "list", "items": ["<strong>Idempotence</strong>: retries should be safe; attach unique IDs", "<strong>End-to-end</strong>: application must enforce its own correctness; don't trust infra alone", "<strong>Prefer integrity over timeliness</strong>: correct-but-stale beats fast-but-wrong", "<strong>Audit periodically</strong>: reconcile derived data against source log", "<strong>Make staleness explicit</strong> in the UI/API when results may lag"]}, {"title": "Ethical checklist for data systems", "type": "list", "items": ["What data are we collecting, and did users meaningfully consent?", "Could our model encode bias? Have we tested across demographic groups?", "What happens when predictions are wrong &mdash; and to whom?", "Are we creating feedback loops that reinforce existing disadvantage?", "What's our plan if the data leaks?", "Could we solve the problem with less data?"]}], "interview": [{"q": "What does Kleppmann mean by 'unbundling the database'?", "diff": "hard", "a": "<p>Traditionally, a DB bundles many functions: storage, indexing, replication log, query planner, transaction manager, pub-sub. Kleppmann proposes <em>unbundling</em>: use a durable event log (Kafka) as the integration backbone, and compose specialized stores as derived views &mdash; search index for text, column store for analytics, cache for latency, graph DB for relationships.</p><p>Each view is kept in sync by stream processors consuming the log. Adding a new capability is adding a new consumer, not a new dual-write. The DB is no longer a single all-purpose box; it's a composition.</p><p>This is the world we already live in to a large degree: Kafka + Debezium + Elasticsearch + Redis + Snowflake is an unbundled DB.</p>"}, {"q": "Compare Lambda and Kappa architectures.", "diff": "hard", "a": "<p><strong>Lambda</strong> (Nathan Marz): two pipelines. A <em>batch</em> layer recomputes correct results from all history (high latency, high accuracy); a <em>speed</em> layer provides fast approximate recent results. Queries merge them. Pro: you always have correct historical results. Con: two codebases, two operational systems &mdash; every feature must be implemented twice.</p><p><strong>Kappa</strong> (Jay Kreps): one stream pipeline. To reprocess history, rewind the log and run the same code on it. Requires a stream processor robust enough to do the job of batch (Flink, Spark Structured Streaming). Pro: single code path. Con: requires strong stream processor guarantees, log long enough to hold history.</p><p>Most modern systems lean kappa, with batch reserved for very long-horizon rebuilds or integration with external batch data sources.</p>"}, {"q": "What's the end-to-end argument, applied to databases?", "diff": "hard", "a": "<p>From Saltzer, Reed, Clark (1984): certain correctness guarantees can only be achieved at the endpoints of a system, not by any intermediate layer.</p><p>Applied here: even if Kafka offers \"exactly-once\" and the stream processor offers \"exactly-once,\" your application still needs to be idempotent end-to-end. Why? Because the guarantees are usually within-system; crossing system boundaries (HTTP retries, user clicks, upstream producer bugs) reintroduces at-least-once.</p><p>Practical consequence: attach a unique operation ID at the edge (client-generated request ID) and dedupe downstream. Don't trust any infrastructure layer to give you exactly-once; make your writes idempotent.</p>"}, {"q": "How can a stream system enforce uniqueness constraints without distributed transactions?", "diff": "hard", "a": "<p>Route all operations on the same uniqueness key to the <em>same partition</em>, then process them sequentially within that partition. Each partition is its own tiny serial execution &mdash; serializable without coordination across partitions.</p><p>Example: enforce that username is unique.</p><ol><li>A \"register username\" request is partitioned by the username hash.</li><li>The partition processor maintains state (set of taken usernames) and either accepts or rejects.</li><li>On accept, it writes a \"UsernameRegistered\" event and an acceptance response.</li></ol><p>No distributed 2PC needed; within a partition everything is local. This is the approach LinkedIn takes internally, and it's how Kafka Streams' interactive queries work.</p>"}, {"q": "What's the tradeoff between timeliness and integrity, and how should you think about it?", "diff": "medium", "a": "<p><strong>Timeliness</strong>: the result reflects recent events (low staleness). <strong>Integrity</strong>: the result is correct (no lost/duplicated data, invariants hold).</p><p>They trade off under failures: you can stall to wait for confirmation (integrity) or proceed with what you have (timeliness). Kleppmann's advice: <strong>prefer integrity; surface staleness explicitly</strong>. Most users would rather see \"data as of 2 minutes ago\" than wrong current data.</p><p>Anti-pattern: silently showing stale results while claiming them fresh &mdash; the worst of both worlds.</p>"}, {"q": "Why does Kleppmann argue for auditability / 'trust but verify'?", "diff": "medium", "a": "<p>Even well-tested systems have bugs, data corruption, off-by-one errors, missed edge cases. Monitoring catches obvious failures; silent corruption can run for months.</p><p>Solution: <strong>periodic reconciliation</strong>. Compare derived stores against the authoritative log or independent source. Accountants do this constantly. For data systems:</p><ul><li>Sum totals in the warehouse vs re-aggregated from raw events</li><li>Verify index entry counts match source table</li><li>Spot-check specific records</li><li>Cryptographically hash log segments to detect tampering</li></ul><p>It's cheap insurance that turns \"silent wrongness\" into \"known discrepancy to investigate\".</p>"}, {"q": "What ethical concerns does Kleppmann raise about data systems?", "diff": "medium", "a": "<p>Several interrelated concerns:</p><ul><li><strong>Predictive analytics bias</strong>: models trained on historical data encode historical unfairness. An \"objective\" credit model can systematically disadvantage groups.</li><li><strong>Feedback loops</strong>: algorithmic decisions alter the world they observe, reinforcing their own predictions.</li><li><strong>Surveillance</strong>: data collected as a byproduct (search, location) is combined to reveal more than users agreed to share.</li><li><strong>Power asymmetry</strong>: individuals have no practical ability to understand, correct, or opt out of systems that make important decisions about them.</li><li><strong>Data leaks</strong>: whatever you collect can be stolen; the safest data is data you never collected.</li></ul><p>Kleppmann's prescription: act as engineers <em>and</em> as citizens. Collect less, audit models, consider who bears the cost when the model is wrong, and build the means to reason about these questions into the system.</p>"}, {"q": "Tie it all together: what's Kleppmann's big-picture vision for building correct data systems?", "diff": "hard", "a": "<ol><li><strong>Immutable log as source of truth</strong>: events are first-class; current state is a materialized view of the log.</li><li><strong>Specialized derived stores</strong>: each store (RDBMS, search, warehouse, cache) is optimized for its access pattern and kept in sync by stream processors.</li><li><strong>Idempotent operations</strong>: everything retryable safely &mdash; the only defensible approach under partial failure.</li><li><strong>End-to-end correctness</strong>: the application enforces its own invariants; infra is best-effort.</li><li><strong>Periodic audits</strong>: verify derived data against source; don't trust monitoring alone.</li><li><strong>Explicit staleness</strong>: honest about what's fresh and what's lagging.</li><li><strong>Ethical stewardship</strong>: collect less, audit models, design for accountability.</li></ol><p>The kappa-style unbundled architecture is Kleppmann's concrete technical shape of this vision. The book ends on a call to engineers to take both technical rigor and ethical responsibility seriously.</p>"}]}]};

// ============================================================
// STATE & STORAGE
// ============================================================
const STORAGE_KEY = "ddia_notes_progress_v1";
let state = {
  currentChapter: "dashboard",
  currentTab: "concepts",
  flashIndex: 0,
  flashFlipped: false,
  theme: "dark",
  progress: {} // chapter_id => { conceptsLearned: {id: true}, qaReviewed: {id: true} }
};

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (saved.progress) state.progress = saved.progress;
    if (saved.theme) state.theme = saved.theme;
  } catch(e) { console.warn("Could not load state", e); }
  applyTheme();
}
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({progress: state.progress, theme: state.theme}));
  } catch(e) {}
}
function getChapterProgress(chId) {
  if (!state.progress[chId]) state.progress[chId] = { conceptsLearned: {}, qaReviewed: {} };
  return state.progress[chId];
}
function applyTheme() {
  document.body.classList.toggle("light", state.theme === "light");
  const t = document.getElementById("themeToggle");
  if (t) t.textContent = state.theme === "light" ? "Dark" : "Light";
}
let _toastTimer;
function showToast(msg, isError) {
  const t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.style.borderColor = isError ? "var(--bad)" : "var(--accent)";
  t.style.opacity = "1";
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { t.style.opacity = "0"; }, 4500);
}

function computeChapterPct(ch) {
  const prog = getChapterProgress(ch.id);
  const totalC = ch.concepts.length;
  const totalQ = ch.interview.length;
  const doneC = Object.keys(prog.conceptsLearned).filter(k => prog.conceptsLearned[k]).length;
  const doneQ = Object.keys(prog.qaReviewed).filter(k => prog.qaReviewed[k]).length;
  if (totalC + totalQ === 0) return 0;
  return Math.round(((doneC + doneQ) / (totalC + totalQ)) * 100);
}
function computeOverallPct() {
  if (!DATA.chapters.length) return 0;
  const totals = DATA.chapters.reduce((acc, ch) => {
    const p = getChapterProgress(ch.id);
    acc.total += ch.concepts.length + ch.interview.length;
    acc.done += Object.keys(p.conceptsLearned).filter(k=>p.conceptsLearned[k]).length;
    acc.done += Object.keys(p.qaReviewed).filter(k=>p.qaReviewed[k]).length;
    return acc;
  }, {total: 0, done: 0});
  return totals.total === 0 ? 0 : Math.round((totals.done/totals.total)*100);
}

function renderSidebar() {
  const sb = document.getElementById("sidebar");
  let html = `
    <div class="chapter-item ${state.currentChapter === "dashboard" ? "active" : ""}" data-chapter="dashboard">
      <div class="chapter-num">✦</div>
      <div class="chapter-title">Dashboard</div>
    </div>
  `;
  const parts = {};
  DATA.chapters.forEach(ch => {
    if (!parts[ch.part]) parts[ch.part] = [];
    parts[ch.part].push(ch);
  });
  const partNames = {
    1: "Part I · Foundations",
    2: "Part II · Distributed Data",
    3: "Part III · Derived Data"
  };
  Object.keys(parts).sort().forEach(pNum => {
    html += `<div class="part-header">${partNames[pNum] || "Part "+pNum}</div>`;
    parts[pNum].forEach(ch => {
      const pct = computeChapterPct(ch);
      const done = pct === 100;
      const r = 8, c = 2 * Math.PI * r, off = c - (pct/100) * c;
      html += `
      <div class="chapter-item ${state.currentChapter === ch.id ? "active" : ""}" data-chapter="${ch.id}">
        <div class="chapter-num">${ch.number}</div>
        <div class="chapter-title">${ch.title}</div>
        <div class="chapter-ring ${done?'done':''}">
          ${done
            ? '<div class="check">✓</div>'
            : `<svg viewBox="0 0 20 20"><circle class="bg" cx="10" cy="10" r="${r}"/><circle class="fg" cx="10" cy="10" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`}
        </div>
      </div>`;
    });
  });
  sb.innerHTML = html;
  sb.querySelectorAll(".chapter-item").forEach(el => {
    el.addEventListener("click", () => {
      state.currentChapter = el.dataset.chapter;
      state.currentTab = "concepts";
      state.flashIndex = 0; state.flashFlipped = false;
      render();
    });
  });
}

// RENDER: main
// ============================================================
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function renderMain() {
  const m = document.getElementById("main");
  if (state.currentChapter === "dashboard") { renderDashboard(); return; }
  const ch = DATA.chapters.find(c => c.id === state.currentChapter);
  if (!ch) { m.innerHTML = "<p>Chapter not found.</p>"; return; }

  const prog = getChapterProgress(ch.id);
  const doneC = ch.concepts.filter((_,i) => prog.conceptsLearned[i]).length;
  const doneQ = ch.interview.filter((_,i) => prog.qaReviewed[i]).length;

  let tabsHtml = `
    <div class="tabs">
      <button class="tab ${state.currentTab==='concepts'?'active':''}" data-tab="concepts">Core Concepts <span class="tab-count">${doneC}/${ch.concepts.length}</span></button>
      <button class="tab ${state.currentTab==='cheatsheet'?'active':''}" data-tab="cheatsheet">Cheatsheet <span class="tab-count">${ch.cheatsheet.length}</span></button>
      <button class="tab ${state.currentTab==='interview'?'active':''}" data-tab="interview">Interview Q&amp;A <span class="tab-count">${doneQ}/${ch.interview.length}</span></button>
      <button class="tab ${state.currentTab==='flashcards'?'active':''}" data-tab="flashcards">Flashcards <span class="tab-count">${ch.concepts.length + ch.interview.length}</span></button>
    </div>
  `;

  let bodyHtml = "";
  if (state.currentTab === "concepts") bodyHtml = renderConcepts(ch);
  else if (state.currentTab === "cheatsheet") bodyHtml = renderCheatsheet(ch);
  else if (state.currentTab === "interview") bodyHtml = renderInterview(ch);
  else if (state.currentTab === "flashcards") bodyHtml = renderFlashcards(ch);

  // prev/next nav
  const idx = DATA.chapters.findIndex(c=>c.id===ch.id);
  const prev = idx > 0 ? DATA.chapters[idx-1] : null;
  const next = idx < DATA.chapters.length-1 ? DATA.chapters[idx+1] : null;

  m.innerHTML = `
    <div class="chapter-header">
      <div class="chapter-label">Chapter ${ch.number} · Part ${['','I','II','III'][ch.part]}</div>
      <h1>${ch.title}</h1>
      <div class="overview-text">${ch.overview}</div>
    </div>
    ${tabsHtml}
    <div id="tabBody">${bodyHtml}</div>
    <div class="chapter-footer">
      ${prev ? `<button class="nav-btn" data-nav="${prev.id}"><div class="nav-btn-label">← Previous</div>Ch ${prev.number}: ${prev.title}</button>` : '<div></div>'}
      ${next ? `<button class="nav-btn right" data-nav="${next.id}"><div class="nav-btn-label">Next →</div>Ch ${next.number}: ${next.title}</button>` : '<div></div>'}
    </div>
  `;

  // wire tab clicks
  m.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => {
      state.currentTab = t.dataset.tab;
      state.flashIndex = 0; state.flashFlipped = false;
      render();
    });
  });
  // wire nav
  m.querySelectorAll("[data-nav]").forEach(n => {
    n.addEventListener("click", () => {
      state.currentChapter = n.dataset.nav;
      state.currentTab = "concepts";
      render();
      window.scrollTo(0, 0);
    });
  });
  // wire concept learn toggles
  m.querySelectorAll(".learn-toggle").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = +btn.dataset.idx;
      const p = getChapterProgress(ch.id);
      p.conceptsLearned[i] = !p.conceptsLearned[i];
      saveState();
      render();
    });
  });
  // wire qa items
  m.querySelectorAll(".qa-header").forEach(h => {
    h.addEventListener("click", () => {
      h.parentElement.classList.toggle("open");
    });
  });
  m.querySelectorAll(".review-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const i = +btn.dataset.idx;
      const p = getChapterProgress(ch.id);
      p.qaReviewed[i] = !p.qaReviewed[i];
      saveState();
      render();
    });
  });
  // wire flashcards
  const fcCard = m.querySelector(".flashcard");
  if (fcCard) {
    fcCard.addEventListener("click", () => {
      state.flashFlipped = !state.flashFlipped;
      render();
    });
  }
  m.querySelectorAll("[data-fc-nav]").forEach(b => {
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      const deck = buildFlashDeck(ch);
      if (b.dataset.fcNav === "prev") {
        state.flashIndex = (state.flashIndex - 1 + deck.length) % deck.length;
      } else if (b.dataset.fcNav === "next") {
        state.flashIndex = (state.flashIndex + 1) % deck.length;
      } else if (b.dataset.fcNav === "shuffle") {
        state.flashIndex = Math.floor(Math.random()*deck.length);
      }
      state.flashFlipped = false;
      render();
    });
  });
}

function renderConcepts(ch) {
  if (!ch.concepts.length) return '<div class="empty-tab">No concepts yet.</div>';
  const prog = getChapterProgress(ch.id);
  let html = '<div class="concepts-grid">';
  ch.concepts.forEach((c, i) => {
    const on = !!prog.conceptsLearned[i];
    html += `
      <div class="concept-card ${on?'learned':''}">
        <button class="learn-toggle ${on?'on':''}" data-idx="${i}" title="Mark as learned">${on?'✓':''}</button>
        <div class="concept-term">${c.term}</div>
        <div class="concept-def">${c.def}</div>
        ${c.why ? `<div class="concept-why">${c.why}</div>` : ''}
        ${c.ex ? `<div class="concept-example">${c.ex}</div>` : ''}
      </div>
    `;
  });
  html += "</div>";
  return html;
}

function renderCheatsheet(ch) {
  if (!ch.cheatsheet.length) return '<div class="empty-tab">No cheatsheet entries yet.</div>';
  let html = "";
  ch.cheatsheet.forEach(cs => {
    html += `<div class="cheatsheet-block"><h3>${cs.title}</h3>`;
    if (cs.type === "table") {
      html += "<table><thead><tr>";
      cs.headers.forEach(h => html += `<th>${h}</th>`);
      html += "</tr></thead><tbody>";
      cs.rows.forEach(r => {
        html += "<tr>";
        r.forEach(c => html += `<td>${c}</td>`);
        html += "</tr>";
      });
      html += "</tbody></table>";
    } else if (cs.type === "list") {
      html += "<ul>";
      cs.items.forEach(it => html += `<li>${it}</li>`);
      html += "</ul>";
    } else if (cs.type === "note") {
      html += `<div>${cs.body}</div>`;
    }
    if (cs.note) html += `<div class="cs-note">${cs.note}</div>`;
    html += "</div>";
  });
  return html;
}

function renderInterview(ch) {
  if (!ch.interview.length) return '<div class="empty-tab">No questions yet.</div>';
  const prog = getChapterProgress(ch.id);
  let html = "";
  ch.interview.forEach((qa, i) => {
    const reviewed = !!prog.qaReviewed[i];
    const diffCls = qa.diff === "easy" ? "diff-easy" : qa.diff === "hard" ? "diff-hard" : "diff-med";
    html += `
      <div class="qa-item ${reviewed?'reviewed':''}">
        <div class="qa-header">
          <span class="diff-badge ${diffCls}">${qa.diff||"med"}</span>
          <div class="qa-q">${qa.q}</div>
          <span class="qa-chevron">▾</span>
        </div>
        <div class="qa-body">
          <div class="qa-body-inner">${qa.a}</div>
          <div class="qa-footer">
            <button class="review-btn ${reviewed?'on':''}" data-idx="${i}">${reviewed?'✓ Reviewed':'Mark reviewed'}</button>
          </div>
        </div>
      </div>
    `;
  });
  return html;
}

function buildFlashDeck(ch) {
  const deck = [];
  ch.concepts.forEach(c => deck.push({front: c.term, back: c.def + (c.why ? "<br><br><em>Why:</em> " + c.why : "") + (c.ex ? "<br><em>Example:</em> " + c.ex : ""), kind: "concept"}));
  ch.interview.forEach(q => deck.push({front: q.q, back: q.a, kind: "qa"}));
  return deck;
}
function renderFlashcards(ch) {
  const deck = buildFlashDeck(ch);
  if (!deck.length) return '<div class="empty-tab">No flashcards yet.</div>';
  const idx = Math.max(0, Math.min(state.flashIndex, deck.length-1));
  const card = deck[idx];
  const flipped = state.flashFlipped;
  return `
    <div class="fc-stage">
      <div class="flashcard ${flipped?'flipped':''}">
        <div class="fc-face fc-front">
          <div class="fc-label">${card.kind === "qa" ? "Question" : "Concept"} · Click to flip</div>
          <div class="fc-content">${card.front}</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-label">Answer · Click to flip</div>
          <div class="fc-content">${card.back}</div>
        </div>
      </div>
    </div>
    <div class="fc-nav">
      <button class="iconbtn" data-fc-nav="prev">← Prev</button>
      <span class="fc-counter">${idx+1} / ${deck.length}</span>
      <button class="iconbtn" data-fc-nav="next">Next →</button>
      <button class="iconbtn" data-fc-nav="shuffle">⇌ Shuffle</button>
    </div>
    <div class="cs-note" style="text-align:center; margin-top:16px;">Tip: press <kbd>Space</kbd> to flip · <kbd>←</kbd> <kbd>→</kbd> to navigate</div>
  `;
}

  const doneConcepts = DATA.chapters.reduce((s,c)=>{
    const p = getChapterProgress(c.id);

  }, 0);

        <div class="dcc-prog-bar"><div class="dcc-prog-fill" style="width:${pct}%"></div></div>

  }).join("");

  m.innerHTML = `
    <div class="dash-hero">
      <h1>Designing Data-Intensive Applications</h1>
      <p>Martin Kleppmann · Interactive interview prep notes · 12 chapters · All core ideas covered</p>
    </div>
    <div class="dash-stats">
      <div class="stat-card"><div class="stat-label">Overall Progress</div><div class="stat-value">${overall}%</div></div>
      <div class="stat-card"><div class="stat-label">Concepts Learned</div><div class="stat-value">${doneConcepts}<span class="small"> / ${totalConcepts}</span></div></div>
      <div class="stat-card"><div class="stat-label">Q&amp;A Reviewed</div><div class="stat-value">${doneQ}<span class="small"> / ${totalQ}</span></div></div>
      <div class="stat-card"><div class="stat-label">Cheatsheet Blocks</div><div class="stat-value">${totalCs}</div></div>
    </div>
    <h2 style="margin-bottom:14px;font-size:18px;">Chapters</h2>
    <div class="dash-chapters">${chaptersHtml}</div>
    <div class="chapter-footer" style="margin-top:32px;">
      <div style="color:var(--text-muted);font-size:13px;">
        <strong>How to use:</strong> Each chapter has Core Concepts, a Cheatsheet with tradeoff tables, Interview Q&amp;A with difficulty levels, and Flashcards. Mark concepts as learned (✓ circle on each card) and questions as reviewed — your progress saves automatically and persists in this browser.
      </div>
    </div>
  `;
  m.querySelectorAll("[data-chapter]").forEach(el => {
    el.addEventListener("click", () => {
      state.currentChapter = el.dataset.chapter;
      state.currentTab = "concepts";
      render();
      window.scrollTo(0, 0);
    });
  });
}

function runSearch(q) {
  const results = [];
  const qq = q.toLowerCase().trim();
  if (qq.length < 2) return [];
  DATA.chapters.forEach(ch => {
    ch.concepts.forEach((c,i) => {
      const hay = (c.term + " " + c.def + " " + (c.why||"") + " " + (c.ex||"")).toLowerCase();
      if (hay.includes(qq)) {
        results.push({ chId: ch.id, chNum: ch.number, chTitle: ch.title, kind: "Concept", title: c.term, snippet: c.def, tab: "concepts" });
      }
    });
    ch.interview.forEach((x,i) => {
      const hay = (x.q + " " + x.a).toLowerCase();
      if (hay.includes(qq)) {
        results.push({ chId: ch.id, chNum: ch.number, chTitle: ch.title, kind: "Q&A", title: x.q, snippet: x.a.replace(/<[^>]+>/g,"").slice(0,120)+"…", tab: "interview" });
      }
    });
    ch.cheatsheet.forEach(cs => {
      if (cs.title.toLowerCase().includes(qq)) {
        results.push({ chId: ch.id, chNum: ch.number, chTitle: ch.title, kind: "Cheatsheet", title: cs.title, snippet: "", tab: "cheatsheet" });
      }
    });
  });
  return results.slice(0, 25);
}
function renderSearch(q) {
  const box = document.getElementById("searchResults");
  const rs = runSearch(q);
  if (rs.length === 0) {
    box.classList.remove("open");
    box.innerHTML = "";
    return;
  }
  box.innerHTML = rs.map((r,i) => `
    <div class="sr-item" data-sr-ch="${r.chId}" data-sr-tab="${r.tab}">
      <div class="sr-label">Ch ${r.chNum} · ${r.kind}</div>
      <div class="sr-title">${r.title}</div>
      ${r.snippet ? `<div class="sr-snippet">${r.snippet}</div>` : ""}
    </div>`).join("");
  box.classList.add("open");
  box.querySelectorAll(".sr-item").forEach(el => {
    el.addEventListener("click", () => {
      state.currentChapter = el.dataset.srCh;
      state.currentTab = el.dataset.srTab;
      document.getElementById("searchBox").value = "";
      box.classList.remove("open");
      render();
      window.scrollTo(0,0);
    });
  });
}

// ============================================================
// TOP LEVEL
// ============================================================
function render() {
  renderSidebar();
  renderMain();
  const pct = computeOverallPct();
  document.getElementById("overallProgressText").textContent = pct + "%";
  document.getElementById("overallProgressFill").style.width = pct + "%";
}

function init() {
  loadState();
  render();

  // Theme toggle
  document.getElementById("themeToggle").addEventListener("click", () => {
    state.theme = state.theme === "light" ? "dark" : "light";
    saveState();
    applyTheme();
  });
  // Reset
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Reset all progress? This cannot be undone.")) {
      state.progress = {};
      saveState();
      render();
    }
  });
  // Export progress
  document.getElementById("exportBtn").addEventListener("click", () => {
    const payload = {
      app: "ddia-notes",
      version: 1,
      exportedAt: new Date().toISOString(),
      progress: state.progress,
      theme: state.theme
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `ddia-progress-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast("Progress exported. Transfer this file to your other device and use ⬆ Import there.");
  });
  // Import progress
  document.getElementById("importBtn").addEventListener("click", () => {
    document.getElementById("importFile").click();
  });
  document.getElementById("importFile").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data || typeof data !== "object" || !data.progress) {
          throw new Error("File doesn't look like a DDIA progress export.");
        }
        const mode = confirm("Import progress:\n\nOK = MERGE with your current progress (anything already marked stays marked)\nCancel = REPLACE your current progress with the file");
        if (mode) {
          // merge
          Object.keys(data.progress).forEach(chId => {
            const cur = state.progress[chId] || { conceptsLearned: {}, qaReviewed: {} };
            const incoming = data.progress[chId] || {};
            cur.conceptsLearned = Object.assign({}, cur.conceptsLearned || {}, incoming.conceptsLearned || {});
            cur.qaReviewed = Object.assign({}, cur.qaReviewed || {}, incoming.qaReviewed || {});
            state.progress[chId] = cur;
          });
        } else {
          state.progress = data.progress;
        }
        if (data.theme) { state.theme = data.theme; applyTheme(); }
        saveState();
        render();
        showToast("Progress imported successfully.");
      } catch (err) {
        showToast("Import failed: " + err.message, true);
      } finally {
        e.target.value = ""; // reset so re-picking the same file works
      }
    };
    reader.readAsText(file);
  });
  // Search
  const sb = document.getElementById("searchBox");
  sb.addEventListener("input", () => renderSearch(sb.value));
  sb.addEventListener("focus", () => { if (sb.value) renderSearch(sb.value); });
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".search-wrap")) {
      document.getElementById("searchResults").classList.remove("open");
    }
  });

  // Keyboard
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") {
      if (e.key === "Escape") { e.target.blur(); document.getElementById("searchResults").classList.remove("open"); }
      return;
    }
    if (e.key === "/") { e.preventDefault(); sb.focus(); }
    if (state.currentTab === "flashcards" && state.currentChapter !== "dashboard") {
      if (e.key === " ") { e.preventDefault(); state.flashFlipped = !state.flashFlipped; render(); }
      if (e.key === "ArrowRight") {
        const ch = DATA.chapters.find(c => c.id === state.currentChapter);
        const deck = buildFlashDeck(ch);
        state.flashIndex = (state.flashIndex + 1) % deck.length;
        state.flashFlipped = false; render();
      }
      if (e.key === "ArrowLeft") {
        const ch = DATA.chapters.find(c => c.id === state.currentChapter);
        const deck = buildFlashDeck(ch);
        state.flashIndex = (state.flashIndex - 1 + deck.length) % deck.length;
        state.flashFlipped = false; render();
      }
    }
  });
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
