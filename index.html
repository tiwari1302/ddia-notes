<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>DDIA Interactive Notes - Interview Prep</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" aria-label="Open chapters menu" title="Chapters">☰</button>

    <div class="brand">
      <div class="logo">D</div>
      DDIA Notes
      <span class="brand-sub">Interactive interview prep</span>
    </div>

    <div class="topbar-spacer"></div>

    <div class="progress-pill" title="Overall progress across all chapters">
      <span id="overallProgressText">0%</span>
      <div class="progress-pill-bar"><div class="progress-pill-fill" id="overallProgressFill" style="width:0%"></div></div>
    </div>

    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" placeholder="Search concepts, questions… (press /)" />
      <div class="search-results" id="searchResults"></div>
    </div>

    <button class="iconbtn" id="exportBtn" title="Export your progress to a file (so you can import it on another device)">⬇ Export</button>
    <button class="iconbtn" id="importBtn" title="Import progress from a file">⬆ Import</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
    <button class="iconbtn" id="themeToggle" title="Toggle theme">Light</button>
    <button class="iconbtn" id="resetBtn" title="Reset all progress">Reset</button>

    <!-- Mobile-only overflow menu -->
    <div class="more-wrap">
      <button class="more-toggle" id="moreToggle" aria-label="More actions" title="More">⋯</button>
      <div class="more-menu" id="moreMenu">
        <button class="iconbtn" data-action="export">⬇ Export progress</button>
        <button class="iconbtn" data-action="import">⬆ Import progress</button>
        <button class="iconbtn" data-action="theme">☀ Toggle theme</button>
        <button class="iconbtn" data-action="reset">⟲ Reset progress</button>
      </div>
    </div>
  </header>

  <!-- Backdrop for mobile drawer -->
  <div class="backdrop" id="backdrop"></div>

  <!-- Layout -->
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

  <!-- Toast for status messages -->
  <div class="toast" id="toast"></div>

  <!-- Scripts: data first, then app -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
