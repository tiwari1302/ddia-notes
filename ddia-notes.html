def": "Data types whose concurrent operations commute, so any ordering of merges yields the same result (e.g., G-Counter, OR-Set, PN-Counter, RGA).", "why": "Mathematical guarantees of convergence without coordination &mdash; the right tool for collaborative apps, offline-first sync."}], "cheatsheet": [{"title": "Three replication architectures", "type": "table", "headers": ["", "Single-leader", "Multi-leader", "Leaderless"], "rows": [["Writes to", "Leader only", "Any leader", "Multiple replicas directly"], ["Conflict handling", "None (serial)", "Critical", "Critical (at read time)"], ["Failover", "Needed", "Not needed per se", "Not needed (no leader)"], ["Typical use", "Most RDBMSs", "Multi-DC, offline clients", "Dynamo-style NoSQL"], ["Examples", "Postgres, MySQL, MongoDB", "CouchDB, multi-master Postgres", "Cassandra, Riak, Dynamo"]]}, {"title": "Replication-lag anomalies & fixes", "type": "table", "headers": ["Anomaly", "Symptom", "Fix"], "rows": [["Read-your-writes", "User can't see own write", "Route own-reads to leader for N sec; track user's log position"], ["Monotonic reads", "Time appears to move backward", "Pin user to one replica"], ["Consistent prefix", "Causally related events seen out of order", "Co-partition causally related data; total-order broadcast"]]}, {"title": "Quorum math (Dynamo-style)", "type": "list", "items": ["N = replication factor", "W = # of nodes that must ack a write", "R = # of nodes a read must get back from", "<strong>If W + R &gt; N</strong>, read and write quorums overlap &rarr; read sees latest write", "Common: N=3, W=2, R=2 (tolerate 1 node failure, good balance)", "W = N = strong durability / slower writes; R = 1 = fastest reads (but risk stale)"], "note": "Sloppy quorum breaks this guarantee &mdash; use with care."}], "interview": [{"q": "Compare single-leader, multi-leader, and leaderless replication.", "diff": "medium", "a": "<p><strong>Single-leader</strong>: one write node, many read replicas. Simple, no write conflicts, but leader is a bottleneck and failover is tricky. (Postgres, MySQL.)</p><p><strong>Multi-leader</strong>: multiple write nodes; writes replicate to each other. Enables multi-DC low-latency writes and offline work. Cost: write conflicts that must be resolved (LWW, CRDTs, app merge).</p><p><strong>Leaderless</strong>: clients write to multiple replicas in parallel. No leader, no failover. Uses quorums (W+R&gt;N) for consistency. Cost: conflicts are normal &mdash; expect concurrent writes and need version vectors.</p><p>Pick: single-leader for most OLTP, multi-leader for multi-region active-active or offline clients, leaderless for availability-first systems (Cassandra, Dynamo).</p>"}, {"q": "What's the tradeoff between synchronous and asynchronous replication?", "diff": "easy", "a": "<p><strong>Sync</strong>: leader waits for follower's ack before confirming to client. Guarantees no data loss on leader failure, but availability drops if <em>any</em> follower is slow/down.</p><p><strong>Async</strong>: leader confirms immediately; followers catch up later. Better availability and latency, but recent writes may be lost if the leader fails before they replicate.</p><p>Common middle ground (<strong>semi-sync</strong>): one follower sync, others async. Guarantees durability on at least two nodes without requiring all followers to be healthy.</p>"}, {"q": "Explain read-your-writes consistency and how to implement it.", "diff": "medium", "a": "<p>A user must always see their own writes on their next read, even if the system is otherwise eventually consistent. Without it: you submit a comment, it appears to vanish on refresh.</p><p>Implementation approaches:</p><ul><li>For a short window after a user's write, route their reads to the leader.</li><li>Track the user's last-write log position; reject followers that haven't caught up.</li><li>Client remembers last-write timestamp and compares against follower's replication lag.</li></ul><p>Multi-device twist: if they write from phone and read from laptop, the system must be aware that both are the same user.</p>"}, {"q": "What is monotonic reads and why is it weaker than read-your-writes?", "diff": "medium", "a": "<p><strong>Monotonic reads</strong>: a user never sees time go backward &mdash; if their first read sees value v@T, their next read sees v@T or later.</p><p>Weaker than read-your-writes because it doesn't require seeing <em>your own</em> writes immediately, only that subsequent reads don't regress. Classic failure: user refreshes a page, lands on a less-caught-up replica, and sees a comment disappear.</p><p>Fix: pin each user to a specific replica (e.g., hash by user ID).</p>"}, {"q": "What is a consistent-prefix read?", "diff": "medium", "a": "<p>If writes happened in a certain causal order, any observer sees either that order or a prefix of it &mdash; never out of order.</p><p>Example (Kleppmann): \"Mrs. Cake, how far into the future can you see?\" \"About ten seconds usually.\" If the answer lands on a faster-replicating partition than the question, a reader can see the answer before the question.</p><p>Fix: keep causally related writes on the same partition, or use a total-order broadcast / causality tracking.</p>"}, {"q": "Walk through the quorum math W+R>N.", "diff": "hard", "a": "<p>Let N replicas, W = writes must hit, R = reads must reach. If W + R &gt; N, any read set and any write set share at least one node. That node will have the latest write, so the read sees it (after picking the newest version).</p><p>Example: N=3, W=2, R=2. A write succeeds after 2 nodes ack. A read asks 2 nodes; at least one of them was in the write set and has the new value.</p><p>Tradeoffs:</p><ul><li>W=N, R=1: writes slow, reads fast, zero staleness</li><li>W=1, R=N: writes fast, reads slow</li><li>W=2, R=2 with N=3: balanced, tolerates one node down</li></ul><p>Caveats: sloppy quorums can violate overlap. Also, quorum doesn't give linearizability by itself (concurrent writes can still create confusion).</p>"}, {"q": "What is split brain and how do you prevent it?", "diff": "hard", "a": "<p>Split brain: two nodes both think they're the leader and accept writes &mdash; classic failure of single-leader systems after a network partition.</p><p>Prevention:</p><ul><li><strong>Consensus-based leader election</strong> (Raft/Paxos): only the node with a majority quorum can be leader.</li><li><strong>Fencing tokens</strong>: leader gets a monotonically increasing token; storage rejects writes from older tokens.</li><li>Don't blindly auto-failover: if partition heals and old leader reappears, it must not continue writing.</li></ul><p>Real-world: Zookeeper/etcd/Consul specifically exist to provide split-brain-safe leader election and fencing.</p>"}, {"q": "How does Dynamo-style leaderless replication detect concurrent writes?", "diff": "hard", "a": "<p>Each replica tracks a <strong>version vector</strong>: a vector of counters, one per replica. A write increments the coordinator's counter and attaches the vector.</p><p>Two writes are concurrent iff neither's vector strictly dominates the other (some components greater, some less). Causally related writes have a strict ordering (one vector dominates).</p><p>Concurrent writes are kept as <em>siblings</em>; the next read returns all siblings and the application merges them (or discards older ones via LWW). Cassandra simplifies with per-cell timestamps and LWW by default.</p>"}, {"q": "What are CRDTs and when would you use them?", "diff": "hard", "a": "<p><strong>CRDTs</strong> (Conflict-free Replicated Data Types) are data structures whose operations are designed to commute: no matter the order in which concurrent updates merge, replicas converge to the same state without explicit coordination.</p><p>Examples:</p><ul><li><strong>G-Counter</strong>: increment-only counter; merge by taking max per replica.</li><li><strong>PN-Counter</strong>: increment + decrement.</li><li><strong>OR-Set</strong> (observed-remove set): add/remove with unique IDs.</li><li><strong>RGA</strong>: replicated growable array, for collaborative text.</li></ul><p>Use cases: collaborative apps (Figma, Linear, Notion-like), offline-first mobile, multi-master DBs. Limitation: not all operations fit a CRDT; for arbitrary business logic you're back to LWW or app-level merge.</p>"}]}, {"id": "ch6", "part": 2, "number": 6, "title": "Partitioning", "overview": "<p>When data exceeds one machine, you <strong>partition</strong> it (aka shard). The chapter discusses partition strategies &mdash; by key range or by hash &mdash; handling skew, partitioning secondary indexes, rebalancing, and request routing.</p><p>Partitioning is usually combined with replication: each partition has N replicas, one leader.</p><p>Key tensions: key-range gives good range scans but risks hot spots; hashing avoids hot spots but breaks range scans. Secondary indexes can be local (fast writes, expensive reads) or global (fast reads, expensive writes).</p>", "concepts": [{"term": "Partition (shard)", "def": "A subset of the data, stored on a subset of nodes. Each record lives on exactly one partition (plus its replicas).", "why": "Enables horizontal scale in both storage and throughput.", "ex": "MongoDB shards, Cassandra partitions (called vnodes), ES shards, Kafka partitions."}, {"term": "Key-range partitioning", "def": "Each partition owns a contiguous range of keys (e.g., a-f, g-m, ...). Ranges need not be even &mdash; chosen to balance load.", "why": "Great for range scans (\"all events in June\"). Risk: hot spots if writes concentrate in one range (e.g., timestamp as key &rarr; all writes go to the most recent partition).", "ex": "HBase, BigTable, 2dsphere / RethinkDB."}, {"term": "Hash-based partitioning", "def": "Apply a hash function to the key, use the hash to pick a partition. Evenly distributes keys.", "why": "Avoids hot spots at the cost of destroying locality &mdash; range scans become scatter-gathers.", "ex": "Cassandra (Murmur3), Dynamo, Couchbase, many consistent-hashing systems."}, {"term": "Hot spot (skew)", "def": "A single partition receives disproportionately more traffic because one key is very popular (celebrity effect) or the workload is skewed.", "why": "Single key can't be partitioned by design; adding random suffix (\"celebrity_42\") spreads load but complicates reads."}, {"term": "Compound partition key", "def": "Partition by one part of the key, sort/cluster by another (Cassandra: partition key + clustering columns). Gives both distribution and in-partition ordering.", "why": "Best of both: hash the user_id (spread), sort by timestamp within a user (efficient time-range scans per user)."}, {"term": "Partitioning secondary indexes (local/by document)", "def": "Each partition indexes only its own records. Writes are simple (local). Reads by secondary attribute require a scatter-gather across all partitions.", "why": "Simpler, better write throughput; bad for selective queries (must ask every partition).", "ex": "MongoDB, ES, Cassandra."}, {"term": "Partitioning secondary indexes (global/by term)", "def": "A global index where the index is itself partitioned by the indexed value. Reads by secondary value go to one partition.", "why": "Fast reads; writes require updating a remote index partition &mdash; a distributed transaction, or async & stale.", "ex": "DynamoDB global secondary indexes, Riak."}, {"term": "Rebalancing", "def": "Moving data between nodes when the cluster changes (add/remove node, imbalance). Must keep the system available while moving bytes.", "why": "Fundamental operational concern; bad rebalancing causes cascading failure."}, {"term": "Rebalancing strategies", "def": "<strong>Fixed number of partitions</strong>: many more partitions than nodes; move whole partitions. <strong>Dynamic partitioning</strong>: split/merge as partitions grow/shrink (HBase). <strong>Partition proportional to nodes</strong>: fixed partitions per node (Cassandra vnodes).", "why": "Each has tradeoffs around initial choice vs flexibility vs metadata size."}, {"term": "Consistent hashing", "def": "Hash keys and nodes onto a ring; each key belongs to the first node clockwise. Adding/removing a node only moves keys in its neighborhood.", "why": "Classic Dynamo mechanism; minimizes data movement on membership changes."}, {"term": "Request routing (service discovery)", "def": "How a client finds the right partition. Three options: (a) any node can forward; (b) routing tier in front; (c) client is routing-aware.", "why": "Needs a way to keep routing metadata consistent under churn &mdash; usually Zookeeper, etcd, or gossip.", "ex": "Cassandra: gossip + any node. Kafka: broker metadata API. MongoDB: mongos router."}], "cheatsheet": [{"title": "Key-range vs Hash partitioning", "type": "table", "headers": ["", "Key-range", "Hash"], "rows": [["Distribution", "Can be uneven; tune ranges", "Usually even"], ["Range scans", "Efficient (contiguous)", "Inefficient (scatter-gather)"], ["Hot spots", "Common with timestamp keys", "Rare (individual hot keys still possible)"], ["Examples", "HBase, BigTable", "Cassandra, Dynamo, Couchbase"]], "note": "Compound partition keys (Cassandra) combine hash distribution with in-partition ordering."}, {"title": "Local vs Global secondary index", "type": "table", "headers": ["", "Local (by document)", "Global (by term)"], "rows": [["Writes", "Cheap (local)", "Expensive (cross-partition)"], ["Reads", "Scatter-gather all partitions", "Hit one index partition"], ["Consistency", "Straightforward", "Needs distributed tx or async / stale"], ["Examples", "MongoDB, Elasticsearch", "DynamoDB GSI, Riak"]]}, {"title": "Hot-spot mitigations", "type": "list", "items": ["<strong>Random prefix</strong>: \"user:42\" &rarr; \"r1:user:42\" for N prefixes. Spreads load but reads must fan out.", "<strong>Compound keys</strong>: include another high-cardinality field", "<strong>Write combining</strong>: aggregate events before writing to the hot key", "<strong>Caching layer</strong> in front for hot reads", "<strong>Denormalize</strong>: store popular data redundantly across partitions"]}], "interview": [{"q": "When would you use hash-based vs key-range partitioning?", "diff": "medium", "a": "<p><strong>Hash</strong>: when writes or reads would otherwise concentrate (e.g., timestamped events, sequential IDs). Even load, but range scans become scatter-gather.</p><p><strong>Key-range</strong>: when range scans are common (time-series \"events between A and B\", prefix queries) and the workload is roughly uniform. HBase/BigTable use this.</p><p>Compound: <strong>Cassandra</strong> hashes the partition key (even load) but sorts within partition by clustering columns (efficient per-user time ranges). This is a common \"best of both\" pattern.</p>"}, {"q": "Describe the hot-key (celebrity) problem and mitigations.", "diff": "medium", "a": "<p>One key gets disproportionately more traffic &mdash; a celebrity's tweets, a popular product. That partition overwhelms while others idle.</p><p>Mitigations:</p><ul><li><strong>Add a prefix/suffix</strong> to spread writes across N derived keys; reads become a scatter-gather over N. Trade: write simplicity for read complexity.</li><li><strong>Cache hot keys</strong> in Redis or at the application layer.</li><li><strong>Split the celebrity</strong>: treat hot users specially (fanout on read rather than write).</li><li><strong>Client-side batching</strong>: combine many small writes into fewer large ones.</li></ul>"}, {"q": "Explain local vs global secondary indexes on partitioned data.", "diff": "hard", "a": "<p><strong>Local (document-partitioned) index</strong>: each partition has its own index of its local records. Writes are cheap (touch one partition). Reads by a secondary attribute (e.g., color=red) must scatter-gather &mdash; ask every partition.</p><p><strong>Global (term-partitioned) index</strong>: the index itself is partitioned, keyed by the indexed attribute. Reads are a single hop. Writes are distributed: updating a document may update an index partition on a different node &mdash; requires distributed transaction (expensive) or async update (stale until caught up).</p><p>Tradeoff: local = write-friendly, scan-all for reads; global = read-friendly, costly or stale on writes. Dynamo GSIs are global and asynchronously updated (eventually consistent).</p>"}, {"q": "How does rebalancing work without taking the cluster down?", "diff": "hard", "a": "<p>Approaches:</p><ol><li><strong>Fixed number of partitions, many more than nodes</strong>: each partition is relatively small. To rebalance, you move whole partitions from overloaded nodes to new ones &mdash; no splitting needed. Simple. Used by Elasticsearch and Couchbase.</li><li><strong>Dynamic partitioning</strong>: a partition splits when it exceeds a size/load threshold and merges when below. HBase, RethinkDB. Adapts to growth but slower to react.</li><li><strong>Partitions proportional to nodes</strong>: a fixed number per node. Adding a node triggers splitting existing partitions for balance. Cassandra's vnodes.</li></ol><p>During move, writes go to both old and new owner for a while; old is deleted once new has caught up. Routing metadata updates so clients stop asking the old owner.</p>"}, {"q": "How does a client know which partition to contact?", "diff": "medium", "a": "<p>Three patterns:</p><ul><li><strong>Any node can route</strong>: client sends to any node, which forwards to the right one. Simpler clients. Cassandra, gossip.</li><li><strong>Routing tier</strong>: a stateless proxy layer handles routing. MongoDB mongos, Vitess.</li><li><strong>Partition-aware client</strong>: client library knows the ring. Kafka clients, Dynamo clients.</li></ul><p>All three need a source of truth for partition assignments. Usually Zookeeper, etcd, or a gossip protocol keeps this metadata consistent under churn.</p>"}, {"q": "How would you design the partitioning for Twitter?", "diff": "hard", "a": "<p>Several keys to consider:</p><ul><li><strong>Tweets</strong>: partition by tweet_id (hash or snowflake-style) &mdash; avoids hot spots. Include user_id in the ID for locality if needed.</li><li><strong>User timeline inbox</strong>: partition by user_id. Hash + maybe compound with tweet_id for ordering.</li><li><strong>Follower graph</strong>: partition by user_id. Fetching someone's followers is cheap (one partition); fetching someone's followees is too.</li><li><strong>Celebrity problem</strong>: a few users have 100M+ followers. Fanout-on-write is expensive; treat them specially (fanout on read for celebrity tweets, merge at timeline read time).</li><li><strong>Search / hashtags</strong>: global (term-partitioned) index, or dedicated search cluster like Elasticsearch.</li></ul>"}, {"q": "What is consistent hashing and why is it useful?", "diff": "medium", "a": "<p>Consistent hashing maps both keys and nodes onto the same hash space (a \"ring\"). Each key belongs to the first node reached clockwise from its hash.</p><p>Why: when a node is added or removed, only the keys in its neighborhood move &mdash; on average 1/N of keys, instead of N/N with plain modulo hashing. This keeps rebalancing cheap.</p><p>Typically each physical node owns many <em>virtual nodes</em> (tokens) on the ring for smoother balance. Dynamo, Cassandra, memcached clients use variants of this.</p>"}, {"q": "Why is partitioning usually combined with replication?", "diff": "easy", "a": "<p>Partitioning distributes storage and throughput; replication provides availability and fault tolerance. You want both: each partition is replicated to N nodes. If a node fails, you don't lose that slice of data; replication lets the partition stay online.</p><p>Typical layout: N replicas per partition, one leader (for write ordering), followers as hot standbys. Writes go to the leader of the correct partition; reads can go to any replica.</p>"}]}, {"id": "ch7", "part": 2, "number": 7, "title": "Transactions", "overview": "<p>Transactions give you a handful of records-at-once that either commit entirely or roll back entirely &mdash; simpler reasoning at the cost of coordination. Kleppmann dismantles the ACID acronym and examines <strong>weak isolation levels</strong> that databases actually provide, and the anomalies each prevents and permits.</p><p>Levels covered: Read Committed, Snapshot Isolation (Repeatable Read), Serializable. Anomalies: dirty reads/writes, non-repeatable reads, lost updates, write skew, phantoms.</p><p>Three ways to implement serializability: actual serial execution, two-phase locking (2PL), and serializable snapshot isolation (SSI).</p>", "concepts": [{"term": "ACID", "def": "<strong>A</strong>tomicity (all or nothing), <strong>C</strong>onsistency (app-level invariants), <strong>I</strong>solation (concurrent tx don't interfere), <strong>D</strong>urability (committed data survives crashes).", "why": "Useful mnemonic but vague in practice &mdash; different DBs implement different guarantees, especially isolation. C is really an app concern, not the DB's."}, {"term": "BASE", "def": "<strong>B</strong>asically <strong>A</strong>vailable, <strong>S</strong>oft state, <strong>E</strong>ventually consistent. Coined by the NoSQL movement as a contrast to ACID.", "why": "Mostly a marketing counter-acronym; doesn't have the precision of ACID."}, {"term": "Atomicity", "def": "A transaction's writes all commit or none do. On abort, all partial effects are rolled back. Also called <em>abortability</em>.", "why": "Critical primitive: lets you retry after failure without worrying about half-applied state."}, {"term": "Isolation", "def": "Concurrent transactions appear to execute serially: their effects don't interleave in pathological ways.", "why": "True serial = easy to reason about but slow. In practice, DBs offer <em>weaker</em> isolation levels with named anomalies."}, {"term": "Dirty read", "def": "Reading another transaction's uncommitted changes.", "why": "Prevented by <strong>Read Committed</strong> (the minimum any mainstream DB offers)."}, {"term": "Dirty write", "def": "Overwriting another transaction's uncommitted changes.", "why": "Prevented by Read Committed via row-level write locks."}, {"term": "Non-repeatable read / read skew", "def": "You read a row, someone else commits an update, you re-read the same row and get different data within one transaction.", "why": "Confuses long transactions that read multiple things assuming the DB is a snapshot."}, {"term": "Snapshot isolation (Repeatable Read)", "def": "Each transaction reads from a consistent snapshot of the DB as of when the tx started. Implemented via MVCC (each row has multiple versions).", "why": "Lets readers and writers not block each other &mdash; the default reading model in Postgres, Oracle, SQL Server, MySQL InnoDB."}, {"term": "Lost update", "def": "Two transactions read a value, modify it, and write it back. The second write overwrites the first's change.", "why": "Classic concurrency bug. Prevented by: atomic SQL (UPDATE ... SET x = x+1), explicit locking (SELECT FOR UPDATE), or compare-and-set.", "ex": "Two users click Like at the same time &mdash; naive read-modify-write counts only one."}, {"term": "Write skew", "def": "Two transactions read an overlapping set of rows, then write different rows based on what they read &mdash; their combined effect violates an invariant.", "why": "Snapshot isolation permits this because each tx's writes don't conflict. Requires serializable isolation or explicit locking.", "ex": "Two on-call doctors each check \"am I the only one on call\" &rarr; both answer \"no, someone else is\" &rarr; both go off call &rarr; no one is on call."}, {"term": "Phantom", "def": "A write in one transaction changes the result of a query that another transaction is running. Similar to write skew but caused by inserts/deletes.", "why": "Classic example of a problem serializable handles but snapshot doesn't."}, {"term": "Serializable isolation", "def": "The strongest: transactions behave as if they ran one at a time, in some order. No anomalies of the above types.", "why": "Gold standard for correctness; price is lower throughput or more conflicts. Three implementation families below."}, {"term": "Actual serial execution", "def": "Run transactions one at a time, on a single thread (with stored procedures defining each). Fast on modern hardware with in-memory data.", "why": "Used by VoltDB, Redis (single-threaded), Datomic. Simplest way to get serializable; constrained by fitting the working set in RAM.", "ex": "VoltDB ships entire transactions as stored procedures; a single thread runs them sequentially per partition."}, {"term": "Two-Phase Locking (2PL)", "def": "Acquire locks on everything you read (shared) or write (exclusive); hold until commit. Simple but prone to deadlocks and latency spikes.", "why": "The traditional way to get serializable &mdash; used by pre-MVCC DBs. Readers block writers and vice versa."}, {"term": "Predicate locks / index-range locks", "def": "Extensions of 2PL that lock not just specific rows but matching-predicate rows, preventing phantoms.", "why": "Necessary because plain row locks can't lock \"rows that don't exist yet\"."}, {"term": "Serializable Snapshot Isolation (SSI)", "def": "Optimistic: reads from a snapshot (MVCC), but at commit time the DB checks whether any concurrent transactions made your reads stale. If yes, abort.", "why": "Best of both worlds: no read locks, reads don't block writes, only aborts when there's real conflict. Postgres 9.1+ supports it.", "ex": "Postgres SERIALIZABLE isolation is SSI."}, {"term": "Optimistic vs pessimistic concurrency", "def": "<strong>Pessimistic</strong> (2PL): assume conflict; lock upfront. <strong>Optimistic</strong> (SSI, CAS): assume no conflict; verify at commit and abort/retry on conflict.", "why": "Optimistic wins when conflicts are rare; pessimistic when contention is high (hot rows)."}], "cheatsheet": [{"title": "Isolation levels vs anomalies", "type": "table", "headers": ["Level", "Dirty read", "Dirty write", "Lost update", "Non-repeatable read", "Write skew / Phantom"], "rows": [["Read Uncommitted", "❌ allowed", "✔ prevented", "❌", "❌", "❌"], ["Read Committed", "✔ prevented", "✔", "❌", "❌", "❌"], ["Snapshot Isolation (RR)", "✔", "✔", "✔ (if atomic ops used)", "✔ prevented", "❌ allowed"], ["Serializable", "✔", "✔", "✔", "✔", "✔ prevented"]], "note": "MySQL's \"Repeatable Read\" and Oracle's \"Serializable\" are historically misnamed; check your DB's actual semantics."}, {"title": "Three ways to get Serializable", "type": "table", "headers": ["", "Serial execution", "2PL", "SSI"], "rows": [["Strategy", "Single-thread", "Pessimistic locks", "Optimistic w/ abort-on-conflict"], ["Reads block writes?", "N/A (no concurrency)", "Yes", "No"], ["Deadlocks?", "No", "Yes", "No"], ["Latency", "Low (no lock contention)", "Can spike under contention", "Low if conflicts rare"], ["Throughput", "One tx at a time per partition", "Good for low contention", "Great for read-heavy"], ["Best for", "Small, fast tx; in-memory", "High contention write apps", "Read-heavy OLTP"], ["Examples", "VoltDB, Redis, Datomic", "Classic RDBMSs (older)", "Postgres 9.1+, FoundationDB"]]}, {"title": "Preventing lost updates", "type": "list", "items": ["<strong>Atomic DB operation</strong>: UPDATE counters SET n = n + 1 WHERE id = ... (avoid read-modify-write in app)", "<strong>Explicit lock</strong>: SELECT ... FOR UPDATE, then update, then commit", "<strong>Automatic detection</strong>: MVCC engines detect lost updates and abort/retry (Postgres RR does this; MySQL's doesn't always)", "<strong>Compare-and-set (CAS)</strong>: UPDATE ... WHERE version = X; retry if 0 rows updated", "Idempotent design if possible &mdash; side-steps the whole problem"]}], "interview": [{"q": "What does ACID really mean?", "diff": "medium", "a": "<p><strong>Atomicity</strong>: a transaction's writes all commit or are all rolled back &mdash; no partial effects. \"Abortability\" would be a better name.</p><p><strong>Consistency</strong>: the DB enforces invariants (uniqueness, FKs, not-null). But application-level consistency is the app's job, not the DB's.</p><p><strong>Isolation</strong>: concurrent tx don't interfere in pathological ways. In practice DBs offer weaker levels (Read Committed, Snapshot, Serializable); true serializability is the strongest.</p><p><strong>Durability</strong>: committed writes survive crashes &mdash; WAL + replication.</p><p>ACID is a useful starting vocabulary but loose; always ask \"which isolation level?\" and \"what exactly does your DB guarantee?\"</p>"}, {"q": "What's the difference between snapshot isolation and serializable?", "diff": "hard", "a": "<p><strong>Snapshot Isolation (SI)</strong>: each transaction reads a consistent snapshot as of its start. Writes don't block reads, reads don't block writes &mdash; great ergonomics. But SI allows <strong>write skew</strong> and phantoms: two transactions can each read the same data and write non-overlapping rows based on that data, producing a combined result no serial ordering would allow.</p><p><strong>Serializable</strong>: transactions behave as if they ran sequentially. Prevents all anomalies. Implementations: serial execution (VoltDB), 2PL (classic RDBMS), or SSI (Postgres 9.1+, detects violations and aborts).</p><p>Concrete write-skew example: two doctors both querying \"how many doctors are on call?\", both see 2, both decide to go off call, both commit &rarr; zero on call. SI permits this because neither write conflicts.</p>"}, {"q": "Explain write skew with a concrete example.", "diff": "hard", "a": "<p>Classic <strong>on-call doctors</strong> example:</p><p>Invariant: at least one doctor must be on call. Currently Alice and Bob are on call. Both request to go off call at the same time.</p><ol><li>Tx Alice: SELECT COUNT(*) FROM on_call &rarr; 2. OK to go off. UPDATE Alice to off_call.</li><li>Tx Bob (concurrently): SELECT COUNT(*) FROM on_call &rarr; 2 (snapshot). OK to go off. UPDATE Bob to off_call.</li><li>Both commit. Zero doctors on call. Invariant violated.</li></ol><p>Neither transaction wrote to rows the other read (each updated its own row), so SI is happy. Prevention: <strong>SERIALIZABLE</strong> isolation, or explicit row locks (SELECT ... FOR UPDATE) on what you read, or a materialized lock row that both tx have to update.</p>"}, {"q": "How do MVCC and snapshot isolation work?", "diff": "hard", "a": "<p>Multi-Version Concurrency Control: instead of overwriting a row, the DB stores the new version alongside the old, each tagged with the transaction ID that created it. A transaction sees the versions that existed when it started.</p><p>Mechanism:</p><ul><li>Each row has <code>xmin</code> (creating tx ID) and <code>xmax</code> (deleting tx ID).</li><li>A tx with snapshot <code>T</code> sees row version V if xmin(V) &lt;= T and (xmax(V) is null or &gt; T), AND the creating tx committed before T started.</li><li>Old versions are garbage collected by vacuum/compaction.</li></ul><p>Reads never block writes and vice versa, because writers create new versions and readers read old ones. This is how Postgres, Oracle, InnoDB, and MongoDB WiredTiger implement RR/SI.</p>"}, {"q": "How does Serializable Snapshot Isolation (SSI) work?", "diff": "hard", "a": "<p>SSI is <em>optimistic</em> serializable: reads happen from an MVCC snapshot (no locks), and at commit time the DB checks for serialization anomalies.</p><p>Roughly, SSI tracks:</p><ul><li>Which rows each transaction <em>read</em> (as predicates or index ranges)</li><li>Which rows were <em>written</em> by concurrent transactions</li></ul><p>If the tx's reads overlap with writes by a concurrent tx that has already committed with a stale version of what this tx read, the tx is <strong>aborted</strong> at commit. The application retries.</p><p>Postgres 9.1+ implements SSI as its SERIALIZABLE level. Pros: no lock contention, great for read-heavy workloads. Cons: under contention, many aborts &mdash; app must handle retries.</p>"}, {"q": "How do you prevent lost updates?", "diff": "medium", "a": "<p>Several techniques, in order of preference:</p><ol><li><strong>Atomic DB operation</strong>: UPDATE counter SET value = value + 1 WHERE id = ?. No read-modify-write in app.</li><li><strong>Explicit lock</strong>: SELECT ... FOR UPDATE before your read, then write.</li><li><strong>Compare-and-set (CAS)</strong>: UPDATE ... SET ... WHERE version = old_version. If 0 rows updated, retry.</li><li><strong>Automatic detection</strong>: some MVCC engines (Postgres Repeatable Read, SSI) detect concurrent overwrites and abort one; app retries.</li></ol><p>Bad approach: read-modify-write in app with no concurrency control. Two tx read 10, both add 1, both write 11. Counter is off by 1.</p>"}, {"q": "When would you pick each of the three serializable implementations?", "diff": "hard", "a": "<p><strong>Serial execution</strong> (VoltDB, Redis, Datomic): when tx are fast and small, data fits in RAM, and you can write stored procedures. Zero coordination overhead but one tx at a time per partition.</p><p><strong>2PL</strong>: when you're using a traditional DB that hasn't moved to MVCC-based serializability. Good for high-contention writes if you accept latency spikes and deadlocks. Aging approach.</p><p><strong>SSI</strong>: modern default for new apps (Postgres 9.1+, FoundationDB, CockroachDB). Read-heavy, low-contention workloads &mdash; no locks, low overhead, occasional aborts.</p><p>Rule of thumb: SSI if you can, serial execution if data is small and tx are simple, 2PL if you must.</p>"}, {"q": "What's the difference between optimistic and pessimistic concurrency control?", "diff": "medium", "a": "<p><strong>Pessimistic</strong> (2PL): acquire locks as you read/write, assuming someone else might conflict. Serializes conflicting work; tx wait on each other.</p><p><strong>Optimistic</strong> (SSI, CAS, OCC): proceed without locks, verify at commit time that no conflict actually occurred, abort if so.</p><p>Optimistic wins when conflicts are rare (most tx succeed, no lock overhead). Pessimistic wins when conflicts are common (optimistic would abort and retry wastefully).</p>"}, {"q": "Why is 'Repeatable Read' a misleading name?", "diff": "medium", "a": "<p>The SQL standard's \"Repeatable Read\" is defined only by what it forbids: dirty reads and non-repeatable reads. It technically permits phantoms and some write-skew variants.</p><p>Vendors implement \"Repeatable Read\" differently:</p><ul><li><strong>Postgres RR</strong>: full snapshot isolation.</li><li><strong>MySQL InnoDB RR</strong>: snapshot for reads + next-key locking that prevents phantoms in some cases.</li><li><strong>Oracle</strong>: calls its default \"Read Committed\" but its SERIALIZABLE is actually SI (not serializable).</li></ul><p>Always check your DB's actual documented guarantees rather than trust the label.</p>"}]}, {"id": "ch8", "part": 2, "number": 8, "title": "The Trouble with Distributed Systems", "overview": "<p>A realistic tour of the ways distributed systems go wrong. Unreliable networks, unreliable clocks, untrustworthy nodes. The chapter argues against naive \"just retry\" thinking and surfaces partial failure, detecting faults, unbounded delays, and time skew.</p><p>Core ideas: you can't distinguish a crashed node from a slow one; clocks are slippery; a single leader isn't safe without <strong>fencing tokens</strong>; truth is defined by the <strong>majority</strong>.</p><p>Sets up the need for consensus (next chapter).</p>", "concepts": [{"term": "Partial failure", "def": "In a distributed system, <em>some</em> parts work and some don't &mdash; and you often can't tell which. A single-node system either runs or doesn't.", "why": "Fundamental difference from monolithic systems; most bugs in distributed systems trace back to naive assumptions that contradict partial failure."}, {"term": "Unreliable networks", "def": "Messages can be lost, delayed, duplicated, or reordered. IP is best-effort; even TCP only gives you in-order delivery on a single connection, not time guarantees.", "why": "You can't tell whether a request arrived and got processed, arrived and the reply was lost, or never arrived at all."}, {"term": "Timeouts", "def": "Since you can't prove a node is dead, you assume it is after some timeout. Too short = false positives (fail fast but flappy); too long = slow failure detection.", "why": "There's no right answer. Designed systems either use adaptive timeouts or accept a tradeoff. Bounded delays are a useful system-model assumption."}, {"term": "Network partition (split)", "def": "A network break that isolates subsets of nodes from each other. Each side may think the other is dead.", "why": "Triggers split-brain scenarios if failover isn't careful."}, {"term": "Synchronous vs partially synchronous vs asynchronous models", "def": "<strong>Synchronous</strong>: bounded message delay + bounded clock drift. <strong>Partially synchronous</strong>: usually synchronous but occasionally not. <strong>Asynchronous</strong>: no timing guarantees.", "why": "Most real networks are partially synchronous. Most real algorithms (Raft, Paxos) are designed for partial synchrony &mdash; \"guarantees correctness always, progress when the network behaves\"."}, {"term": "Monotonic vs time-of-day clocks", "def": "<strong>Monotonic clocks</strong>: always moves forward, not NTP-adjustable; good for measuring durations. <strong>Time-of-day clocks</strong>: wall clock, NTP-adjustable, can jump back or forward.", "why": "Never use a time-of-day clock to measure elapsed time (it can go backward). Never use a monotonic clock as a timestamp (it's not meaningful across nodes)."}, {"term": "Clock skew & NTP drift", "def": "Clocks on different machines drift apart; NTP syncs them periodically, but with error of milliseconds to seconds depending on the network.", "why": "Timestamps across nodes are never reliable to fine precision. A write \"3ms after\" another could have earlier wall-clock time on a different node."}, {"term": "Google TrueTime / bounded uncertainty", "def": "Google Spanner exposes time as an interval [earliest, latest]; the system waits out the uncertainty window before committing.", "why": "Solves timestamp ordering at scale by making uncertainty explicit. Requires GPS + atomic clocks in every DC."}, {"term": "Process pauses (GC, VM pauses)", "def": "A process can be paused unexpectedly for seconds &mdash; GC, VM migration, hypervisor priority, swapping. During the pause, other nodes may consider it dead.", "why": "Invalidates reasoning like \"I just checked the lease expires at 10:00, so I'll write through 09:59\". You might have paused between check and write."}, {"term": "Fencing token", "def": "A monotonically increasing token granted on lease acquisition. Storage checks the token and refuses writes with older tokens.", "why": "Protects against the classic bug: a paused leader wakes up thinking it still has the lease and writes to storage after a new leader has taken over.", "ex": "Client 1 has lease with token 33 &rarr; pauses &rarr; lease expires &rarr; client 2 gets token 34 &rarr; client 1 wakes up, tries to write with token 33 &rarr; storage rejects."}, {"term": "Truth is defined by the majority (quorum)", "def": "When nodes disagree, \"truth\" is whatever a majority agrees on &mdash; not what any one node believes.", "why": "Keeps consistency despite partitions and Byzantine-ish behavior: a minority that believes wrong things can't override the majority."}, {"term": "Byzantine fault", "def": "A node behaves arbitrarily &mdash; possibly maliciously &mdash; not just crashed or slow. Common in adversarial settings (cryptocurrency) but rare inside a datacenter.", "why": "Protocols that tolerate Byzantine faults (BFT) exist but are much more expensive; most systems assume trusted nodes and focus on crash/network faults."}, {"term": "Crash-stop vs crash-recovery vs Byzantine", "def": "Fault models from weakest to strongest assumption: <strong>Crash-stop</strong> (dead nodes stay dead), <strong>Crash-recovery</strong> (nodes may come back with disk), <strong>Byzantine</strong> (nodes may lie or be attackers).", "why": "Choose the weakest model that fits reality &mdash; protocols get exponentially harder as you move toward Byzantine."}, {"term": "System model & safety/liveness", "def": "A system model is a set of assumptions about faults. <strong>Safety</strong>: bad things don't happen (nothing is wrong). <strong>Liveness</strong>: good things eventually happen (progress).", "why": "Most correct distributed algorithms guarantee safety always and liveness under favorable conditions."}], "cheatsheet": [{"title": "What can go wrong over the network?", "type": "list", "items": ["Request lost", "Request delayed (then arrives after timeout)", "Request delivered but response lost", "Response delayed", "Duplicate delivery", "Out-of-order delivery", "Receiver alive but too busy to respond", "Receiver crashed mid-processing"], "note": "You typically can't distinguish between these from the sender's side."}, {"title": "Why you can't trust clocks", "type": "list", "items": ["Clocks drift (quartz: seconds per day without NTP)", "NTP can jump the clock forward or backward", "Leap seconds can cause clocks to stop or repeat", "Virtualization can pause the VM; the clock resumes without notice", "Time-of-day clock ≠ monotonic clock &mdash; use monotonic for durations", "Two machines' wall-clocks can disagree by milliseconds to seconds"]}, {"title": "Fault models and what you get", "type": "table", "headers": ["Model", "Assumption", "Used by"], "rows": [["Crash-stop", "Failed nodes never recover", "Simplest abstraction; rarely real"], ["Crash-recovery", "Nodes may crash and come back with persistent state", "Raft, Paxos, most real systems"], ["Byzantine", "Nodes may lie, be attacked, disobey protocol", "Blockchains, BFT systems"]]}, {"title": "Fencing tokens to prevent stale-leader writes", "type": "list", "items": ["Lease service issues monotonically increasing tokens", "Holder attaches its token to every write", "Storage rejects writes with token &lt; max seen", "Old (paused) leader waking up can't corrupt state", "Zookeeper <code>zxid</code> and etcd revision IDs are used this way"]}], "interview": [{"q": "Why can't you distinguish a slow node from a dead node?", "diff": "medium", "a": "<p>You're only ever reasoning from the messages you receive. If no reply comes back, either (a) the node is dead, (b) it's alive but slow, (c) your request was lost, (d) its reply was lost, (e) there's a network partition between you. You can't tell which.</p><p>So we use <strong>timeouts</strong>: after N ms of no reply, assume dead. Too short = false positives; too long = slow failure detection. This is why distributed algorithms are designed around <em>not trusting the liveness of any one node</em> and rely on quorum votes.</p>"}, {"q": "Give an example of why you shouldn't use wall-clock time for distributed ordering.", "diff": "hard", "a": "<p>Cassandra used to use wall-clock timestamps for last-write-wins conflict resolution. Scenario:</p><ol><li>Node A's clock is 3s ahead of node B's (NTP hasn't reconciled yet).</li><li>Client 1 writes to node A at wall-time 10:00:03 (the write reaches B at 10:00:00 B-time).</li><li>Client 2 writes to node B at wall-time 10:00:01 (B-time).</li><li>Per timestamps, client 2's write (10:00:01) is older than client 1's (10:00:03) &mdash; client 2's write is discarded despite being \"later\" in real time from the application perspective.</li></ol><p>Clock skew silently eats data. Solutions: <em>logical</em> clocks (Lamport, vector clocks), <em>bounded</em> clocks (Spanner's TrueTime), or simply <em>don't</em> rely on timestamps for causality.</p>"}, {"q": "What is a fencing token and why is it needed?", "diff": "hard", "a": "<p>When a leader acquires a lease, it's given a monotonically increasing token (e.g., from Zookeeper). Every write to storage must include this token, and storage rejects writes with tokens older than the newest it has seen.</p><p>Why: consider a leader holding a 30s lease. It pauses (GC, VM pause) for 40 seconds. The lease expires; the cluster elects a new leader (token +1) who starts writing. The old leader wakes up, thinks it still holds the lease, and writes too &mdash; now two leaders clobber storage.</p><p>With fencing tokens, the old leader's writes are tagged with the old token and rejected. Solves the split-brain-after-pause problem cleanly. Used by Zookeeper (<code>zxid</code>), etcd (<code>revision</code>), Spanner.</p>"}, {"q": "What is the difference between monotonic and time-of-day clocks?", "diff": "easy", "a": "<p><strong>Time-of-day clock</strong> (wall clock): gives the current calendar time. NTP-synchronized, but can jump forward or backward when corrected. Bad for measuring durations.</p><p><strong>Monotonic clock</strong>: always moves forward, not adjusted by NTP. Good for measuring elapsed time within one process. Not meaningful across nodes (each machine's monotonic clock has a different origin).</p><p>Rules: use monotonic for <em>durations</em>, wall clock for <em>timestamps-as-identifiers</em> (with caveats), and neither as a basis for distributed ordering without explicit uncertainty handling.</p>"}, {"q": "What is a Byzantine fault, and do most systems handle them?", "diff": "medium", "a": "<p>Byzantine fault: a node behaves arbitrarily &mdash; lying, sending contradictory messages to different peers, or being actively malicious. Named after the Byzantine Generals problem.</p><p>Most internal datacenter systems <em>don't</em> handle Byzantine faults. They assume crash-recovery: nodes may die and come back but don't lie. This is a reasonable assumption when you operate the hardware and trust the operators.</p><p>BFT systems (used in blockchains, some aerospace, some multi-org systems) tolerate a minority of lying nodes but are much slower &mdash; typically O(N&sup2;) messages per decision vs O(N) for Raft.</p>"}, {"q": "What does 'truth is defined by the majority' mean?", "diff": "medium", "a": "<p>When a distributed system disagrees with itself (network partition, slow nodes, confused leader), the correct \"truth\" is whatever a strict majority (quorum) of nodes agree on &mdash; not what any individual node believes.</p><p>This principle underlies consensus protocols: a value is committed when a majority has recorded it. Even if some nodes are partitioned away and believe something different, they're \"wrong\" until they rejoin and learn the committed truth.</p><p>Concretely: in Raft, a log entry is committed when a majority of nodes have it; a new leader must get a majority's vote; a partitioned minority cannot elect a competing leader.</p>"}, {"q": "Explain process pauses and their impact on distributed systems.", "diff": "hard", "a": "<p>A process can be paused unexpectedly for seconds by: stop-the-world GC, VM migration, hypervisor scheduling, swap-out, signaling. During the pause, the process has no sense of time passing.</p><p>Impact: consider \"I just checked at 09:59:55 that the lease expires at 10:00; I have 5s, I'll do the work.\" If the process pauses for 10s between the check and the work, when it resumes the lease has expired &mdash; but it proceeds anyway. Writing with an expired lease after a new leader took over is the classic split-brain bug.</p><p>Solution: don't rely on \"I have plenty of time\" reasoning. Use fencing tokens, re-check the lease on every operation (or atomic conditional writes), and design for unbounded pause tolerance.</p>"}, {"q": "What's the difference between safety and liveness?", "diff": "easy", "a": "<p><strong>Safety</strong>: \"nothing bad ever happens\". If the algorithm is stuck and never decides, that's fine for safety. Example: Raft never commits a wrong value.</p><p><strong>Liveness</strong>: \"something good eventually happens\". The algorithm eventually makes progress. Example: Raft eventually elects a leader and commits entries.</p><p>Most correct distributed algorithms guarantee <em>safety unconditionally</em> and <em>liveness under favorable conditions</em> (e.g., the network eventually stops dropping messages). FLP impossibility says you can't have both in a fully asynchronous model with even one crash fault; partial synchrony is the escape hatch.</p>"}]}, {"id": "ch9", "part": 2, "number": 9, "title": "Consistency and Consensus", "overview": "<p>Having established that distributed systems are hard (Ch 8), this chapter builds up the strongest consistency model (<strong>linearizability</strong>), then the ordering and consensus primitives that implement it: causality, Lamport timestamps, total order broadcast, and consensus (Paxos, Raft, Zab).</p><p>Also: two-phase commit (2PC) for distributed transactions, its problems, and why consensus-based systems (ZooKeeper, etcd) are used for coordination.</p><p>The CAP theorem is revisited and deflated; the linearizability-availability tradeoff under partitions is the real content.</p>", "concepts": [{"term": "Linearizability", "def": "The strongest consistency model: the system appears to have one copy of the data, every operation takes effect atomically at some point between its call and return. Also called \"strong consistency\" or \"atomic consistency\".", "why": "Simple reasoning: as if there's one source of truth. Expensive: requires coordination for every operation.", "ex": "A single-node DB is linearizable. Single-leader replication can be linearizable with careful reads."}, {"term": "Serializability vs linearizability", "def": "<strong>Serializability</strong>: multi-object transactions appear to run in <em>some</em> serial order (may be not recent). <strong>Linearizability</strong>: single-object operations appear in <em>real-time</em> order. Strict serializability = both.", "why": "Orthogonal: serializability is about tx isolation; linearizability is about recency/ordering of individual ops."}, {"term": "Consistent prefix / causal consistency", "def": "Causally related operations are observed in causal order; independent operations can be seen in any order.", "why": "Weaker than linearizability but respects \"happens-before\". Captures natural ordering without full global agreement &mdash; often sufficient."}, {"term": "CAP theorem", "def": "When a partition happens, you can't have both linearizability (C) and availability (A) &mdash; you pick one.", "why": "Often misquoted. It's not \"pick 2 of 3\" &mdash; partitions will happen, and you must decide how to handle them. Most systems are neither pure CP nor pure AP."}, {"term": "Linearizable systems & their cost", "def": "Must coordinate across nodes, so latency is bounded below by network round-trip. Under partition, the minority side must stop serving writes.", "why": "Nothing is \"free\"; linearizability trades latency and availability for simplicity of reasoning."}, {"term": "Total order broadcast (atomic broadcast)", "def": "A protocol where all nodes receive the same messages in the same order. Guarantees: reliable delivery + total order.", "why": "Exactly equivalent to consensus: if you can do one, you can do the other. It's the abstraction on top of which linearizable storage is built."}, {"term": "Lamport timestamps", "def": "A logical clock: each node has a counter; on every event, increment; on receive, take max(local, received)+1. Gives a total order consistent with causality.", "why": "Cheap way to order events without wall clocks. Doesn't capture causality as precisely as vector clocks but gives a valid total order."}, {"term": "Vector clocks vs version vectors", "def": "<strong>Vector clock</strong>: per-process counter vector; tracks <em>events</em> and lets you compare for happens-before or concurrency. <strong>Version vector</strong>: similar idea, for comparing <em>data versions</em> in a replicated store.", "why": "Detect concurrent writes in leaderless systems; merge via CRDTs or surface to app."}, {"term": "Two-Phase Commit (2PC)", "def": "Distributed commit protocol. Phase 1 (prepare): coordinator asks each participant to prepare; participants vote yes/no. Phase 2 (commit): if all yes, coordinator tells everyone to commit; else abort.", "why": "Gives atomic commit across nodes. Problems: blocking on coordinator failure, long lock hold times, heavy coordination."}, {"term": "Coordinator failure in 2PC", "def": "If the coordinator crashes after some participants have prepared, those participants are stuck holding locks until it recovers (or admin intervenes).", "why": "The blocking problem is 2PC's worst feature. 3PC tries to fix it but isn't widely used; modern systems use consensus-based protocols instead."}, {"term": "Consensus", "def": "Several nodes agree on a single value/decision despite faults. Must satisfy: agreement (all nodes agree), integrity (no change of mind), validity (agreed value was proposed), termination (eventual decision).", "why": "The problem underlying leader election, atomic commit, distributed locks, and more. Paxos, Raft, Zab solve it."}, {"term": "Raft / Paxos / Zab", "def": "Three popular consensus algorithms. <strong>Paxos</strong>: original, tricky; <strong>Raft</strong>: designed for understandability; <strong>Zab</strong>: Zookeeper's, similar to Raft.", "why": "All provide leader-based consensus: elect a leader by majority, leader proposes, followers accept, committed when majority replicates."}, {"term": "FLP impossibility", "def": "In an asynchronous network, no deterministic algorithm can solve consensus if even one node may crash. Escape: assume partial synchrony or randomness.", "why": "Theoretical limit. In practice, Raft/Paxos guarantee safety always and liveness when the network is eventually reliable."}, {"term": "Leader election", "def": "Agreeing on who the leader is, safely. Usually done via consensus itself: candidate requests votes, wins with a majority, gets a fencing token.", "why": "Foundation of single-leader replication. Must prevent split-brain under partitions."}, {"term": "Membership & coordination services", "def": "Tools like ZooKeeper, etcd, Consul that provide consensus-backed primitives: leader election, distributed locks, configuration, service discovery.", "why": "Avoid writing your own consensus; use a proven service. Most big distributed systems (Kafka, HBase, Kubernetes) sit on one of these.", "ex": "Kubernetes uses etcd; HBase uses ZooKeeper; Consul provides DNS + KV."}], "cheatsheet": [{"title": "Consistency models (strongest to weakest)", "type": "table", "headers": ["Model", "Guarantee", "Cost"], "rows": [["Strict serializability", "Linearizable + serializable multi-object", "Highest coordination"], ["Linearizability", "Appears as single-copy; ops in real-time order", "Coordination per op"], ["Sequential consistency", "Consistent order; not necessarily real-time", "Looser"], ["Causal consistency", "Causally related ops in order", "Track causality"], ["Eventual consistency", "Eventually everyone agrees; no ordering promise", "Cheapest"]]}, {"title": "2PC vs Consensus", "type": "table", "headers": ["", "2PC", "Consensus (Raft/Paxos)"], "rows": [["Nodes needed to commit", "All participants", "Majority"], ["Tolerates participant crash?", "No (blocks)", "Yes (if majority alive)"], ["Typical use", "Cross-DB atomic commit (XA)", "Leader election, log replication"], ["Well-known implementations", "XA, distributed RDBMSs", "Raft, Paxos, Zab (ZK)"]]}, {"title": "Ordering mechanisms", "type": "list", "items": ["<strong>Lamport timestamps</strong>: total order, cheap, consistent with causality", "<strong>Vector clocks</strong>: partial order, can detect concurrency", "<strong>Total order broadcast</strong>: atomic broadcast, equivalent to consensus", "<strong>Single-leader</strong>: leader's assigned order is the order (while it's leader)", "<strong>Spanner / TrueTime</strong>: physically-bounded timestamps, externally consistent"]}, {"title": "CAP theorem revisited", "type": "list", "items": ["Partition is not optional; it will happen", "So pick: under partition, sacrifice <strong>linearizability</strong> (stay available, serve stale) or <strong>availability</strong> (refuse writes to minority side)", "CP: Zookeeper, etcd, HBase, Spanner", "AP: Cassandra, DynamoDB, Riak", "\"Two of three\" is a misleading simplification; reality is nuanced"]}], "interview": [{"q": "What does linearizability mean and why is it useful?", "diff": "hard", "a": "<p><strong>Linearizability</strong>: the system appears to have one copy of the data, and every operation takes effect atomically at some point between when it was called and when it returned. Equivalently: if op A completes before op B starts (in real time), B sees A's effect.</p><p>Why useful:</p><ul><li>Makes distributed systems look like a single node &mdash; easy to reason about.</li><li>Required for some primitives: distributed locks, uniqueness constraints, leader election.</li><li>Basis for safety properties in fault-tolerant systems.</li></ul><p>Cost: every read/write requires coordination, so latency has a floor at the cross-node round-trip. Under a partition, the minority side can't serve operations (CAP).</p>"}, {"q": "What's the difference between linearizability and serializability?", "diff": "hard", "a": "<p>They live on different axes:</p><ul><li><strong>Serializability</strong>: about multi-object <em>transactions</em>. They appear in some serial order; that order may be any consistent one (not necessarily recent).</li><li><strong>Linearizability</strong>: about single-object <em>operations</em>. Ops appear in <em>real-time</em> order.</li></ul><p>You can have one without the other:</p><ul><li>Snapshot Isolation = serializable-ish but not linearizable (reads from old snapshot).</li><li>A linearizable KV store isn't serializable for multi-key transactions.</li><li>Spanner offers <strong>strict serializability</strong> = both combined.</li></ul>"}, {"q": "Explain the CAP theorem and what it really says.", "diff": "medium", "a": "<p>CAP: in the presence of a network partition (P), a system cannot provide both full linearizable consistency (C) and availability (A). You must sacrifice one.</p><p>Common misreadings:</p><ul><li>\"Pick 2 of 3\" &mdash; wrong. Partitions are not optional; you choose between C and A <em>during</em> partitions.</li><li>Outside partitions, you can (and should) have both.</li></ul><p>Real question: in a partition, do you refuse writes to the minority side (CP: Zookeeper, etcd, Spanner) or keep serving but risk inconsistency (AP: Cassandra, Dynamo)?</p><p>CAP is a coarse tool; more useful concepts are PACELC (partition vs else/latency vs consistency) and specific consistency models.</p>"}, {"q": "Explain two-phase commit (2PC) and its weaknesses.", "diff": "hard", "a": "<p>Protocol for atomic commit across multiple participants:</p><ol><li><strong>Prepare phase</strong>: coordinator sends PREPARE to each participant. Each locks the relevant resources and either votes YES (ready to commit) or NO (abort).</li><li><strong>Commit phase</strong>: if all voted YES, coordinator sends COMMIT; else ABORT. Participants apply accordingly.</li></ol><p>Weaknesses:</p><ul><li><strong>Blocking</strong>: if coordinator crashes after receiving votes but before sending the decision, participants are stuck holding locks indefinitely until it recovers.</li><li><strong>Long lock hold</strong>: resources are locked across network round-trips.</li><li><strong>Coordinator is a SPOF</strong>: without consensus for the coordinator, it's a liability.</li><li>Single slow participant slows everyone.</li></ul><p>Modern alternatives: consensus-based replication (everything is a replicated state machine), or eschew distributed transactions via saga patterns.</p>"}, {"q": "What is consensus and why does it matter?", "diff": "hard", "a": "<p>Consensus: a group of nodes agree on a single value despite faults. Formally requires:</p><ul><li><strong>Agreement</strong>: all correct nodes decide the same value.</li><li><strong>Integrity</strong>: no node decides twice.</li><li><strong>Validity</strong>: the decided value was proposed by some node.</li><li><strong>Termination</strong>: every correct node eventually decides.</li></ul><p>Why it matters: consensus solves many distributed problems at once &mdash; leader election, atomic commit, distributed locks, configuration agreement. If you can do consensus, you can do <em>total order broadcast</em>, from which linearizable storage follows.</p><p>Implementations: Paxos, Raft, Zab. All need a majority to make progress; tolerate f failures with 2f+1 nodes.</p>"}, {"q": "Compare Paxos and Raft.", "diff": "hard", "a": "<p>Both solve consensus with leader-based replication.</p><p><strong>Paxos</strong>: the original (1989/1998). Very general; many variants (Multi-Paxos, Fast Paxos, etc.). Notoriously hard to understand and implement correctly. Used by Google Chubby, Spanner (under the hood).</p><p><strong>Raft</strong> (2014): designed explicitly for understandability. Strong separation of concerns: leader election, log replication, safety. Used by etcd, CockroachDB, TiKV, Consul. Simpler to implement from scratch.</p><p>They provide equivalent guarantees. Raft has become the default choice for new systems due to easier implementation.</p>"}, {"q": "Why do systems like ZooKeeper and etcd exist?", "diff": "medium", "a": "<p>They provide consensus-backed <em>coordination primitives</em> so that other distributed systems don't have to implement consensus from scratch. Typical features:</p><ul><li>Reliable config storage (small data, strong consistency)</li><li>Leader election</li><li>Distributed locks / leases with fencing tokens</li><li>Service discovery</li><li>Ephemeral nodes (client heartbeats)</li></ul><p>Clients of these services: Kafka uses ZooKeeper for controller election and topic metadata; Kubernetes uses etcd as its source of truth; HBase uses ZooKeeper for region assignments; Consul does service discovery + DNS.</p><p>Writing your own consensus is a well-documented trap &mdash; use one of these.</p>"}, {"q": "What is total order broadcast and how does it relate to consensus?", "diff": "hard", "a": "<p><strong>Total order broadcast (atomic broadcast)</strong>: a protocol where all nodes receive messages in the same order. Reliable (no drops) + total order + same order for all.</p><p>It's <em>equivalent</em> to consensus: implementing one lets you implement the other. If all nodes agree on \"what's the next message\" (one consensus round per message), they have total order. Conversely, if you have total order broadcast, you can run consensus by broadcasting proposals.</p><p>Why it matters: linearizable replicated state machines are built on total order broadcast &mdash; deliver the same commands in the same order to every replica, and they end up with the same state.</p>"}, {"q": "What is the FLP impossibility result?", "diff": "hard", "a": "<p><strong>Fischer-Lynch-Paterson (1985)</strong>: in a fully asynchronous network (no bounds on message delay), no deterministic consensus algorithm can guarantee termination if even a single node may crash.</p><p>Why it doesn't matter in practice:</p><ul><li>Real networks are partially synchronous &mdash; usually fast, occasionally not.</li><li>Raft and Paxos guarantee <em>safety</em> unconditionally and <em>liveness</em> when the network eventually behaves.</li><li>Randomization (e.g., random election timeouts in Raft) side-steps FLP.</li></ul><p>Takeaway: FLP is a theoretical limit; correct algorithms assume partial synchrony and ensure progress under favorable conditions.</p>"}]}, {"id": "ch10", "part": 3, "number": 10, "title": "Batch Processing", "overview": "<p>Processing huge bounded datasets offline. The chapter starts with Unix pipelines (small, composable programs communicating through stdin/stdout) as the original batch system, then extends those ideas to <strong>MapReduce</strong> and distributed filesystems (HDFS).</p><p>Deep dives into <strong>reduce-side joins</strong>, <strong>map-side joins</strong> (broadcast, partitioned, merge), workflow engines, and why MapReduce has been displaced by <strong>dataflow engines</strong> (Spark, Flink, Tez) that keep intermediate state in memory and optimize across stages.</p>", "concepts": [{"term": "Batch processing", "def": "Process a large, <strong>bounded</strong> input dataset to produce an output; latency seconds to hours. Contrast with online (interactive, ms) and streaming (unbounded, ms-s).", "why": "Good for analytics, ML training, data warehousing, building search indexes &mdash; anything where you can re-run on the same inputs and get the same outputs (deterministic, idempotent)."}, {"term": "Unix philosophy", "def": "Small programs that do one thing well, communicate via text streams, connected by pipes. Outputs of one program become inputs to the next.", "why": "Kleppmann's point: this is a mini-MapReduce. Same properties &mdash; composability, immutable inputs, rerunnable &mdash; that make big-data systems work.", "ex": "sort | uniq -c | sort -rn | head is a 4-stage \"MapReduce\" for log analysis."}, {"term": "MapReduce", "def": "Programming model: write a <strong>mapper</strong> (per-record, outputs key-value) and a <strong>reducer</strong> (per-key, aggregates values). Framework handles parallelism, shuffle, fault tolerance.", "why": "Enabled processing petabytes on commodity hardware. Now largely replaced by higher-level engines (Spark, Flink) but conceptually foundational."}, {"term": "HDFS / distributed filesystem", "def": "Files chunked into blocks (e.g., 128MB) and replicated across nodes. Optimized for sequential throughput over tiny-file random access.", "why": "Shared nothing storage that MapReduce (and Spark, Flink) read from. S3/GCS are the cloud replacements.", "ex": "HDFS, GFS, S3, GCS, Azure Blob."}, {"term": "Shuffle", "def": "Between map and reduce stages, data is partitioned and sorted so all values with the same key end up at the same reducer. Typically expensive (disk + network).", "why": "Dominates the cost of many jobs; reducing shuffle is a key optimization (combiners, map-side aggregation)."}, {"term": "Reduce-side join", "def": "Both inputs are tagged with a join key and shuffled; the reducer gets all records for a key from both sides and joins them.", "why": "General-purpose: works for any size inputs and any join key. Downside: full shuffle of both sides."}, {"term": "Map-side join (broadcast)", "def": "When one side is small enough to fit in memory, ship it to every mapper. Each mapper streams the large side and joins locally. No reduce, no shuffle.", "why": "Great for star-schema joins (big fact table &times; small dimension table). 10&times; faster than reduce-side."}, {"term": "Map-side join (partitioned)", "def": "If both inputs are already partitioned the same way on the join key (e.g., both hashed by user_id into N partitions), each mapper joins one partition locally.", "why": "No shuffle needed; requires coordinated partitioning upstream."}, {"term": "Map-side merge join", "def": "If both inputs are already partitioned AND sorted on the join key, a merge join streams them in order.", "why": "Efficient for pre-sorted inputs (e.g., time-series). Used by Hive for co-sorted tables."}, {"term": "Workflow engine", "def": "Coordinates many MapReduce/Spark jobs into a DAG with dependencies. Handles scheduling, retries, backfills.", "why": "Real batch pipelines are dozens of steps; you need something to orchestrate.", "ex": "Oozie, Luigi, Airflow, Prefect, Dagster."}, {"term": "Dataflow engines (Spark, Flink, Tez)", "def": "Generalization of MapReduce: arbitrary DAGs of transformations. Intermediate results kept in memory when possible; no mandatory sort-and-shuffle between every pair of stages.", "why": "10&ndash;100&times; faster than MapReduce for iterative jobs (ML, graph). Better optimization across stages."}, {"term": "Materialization of intermediate state", "def": "In classic MapReduce each stage writes to HDFS; dataflow engines avoid this by piping intermediate data in memory (with checkpoints for fault tolerance).", "why": "The biggest performance win of Spark over MapReduce."}, {"term": "High-level APIs (Hive, Pig, Spark SQL)", "def": "SQL-ish declarative languages compiled down to MapReduce/Spark/Tez jobs. Hide the low-level API.", "why": "Analysts write in SQL; engine picks joins, partitions, and order. Nearly always the right interface for ad-hoc analytics.", "ex": "Hive, Pig, Impala, Presto/Trino, Spark SQL, BigQuery SQL."}, {"term": "Iterative / graph processing (Pregel, BSP)", "def": "Model for iterative algorithms like PageRank: each \"superstep\" every node exchanges messages with its neighbors, then computes. The framework handles the iteration.", "why": "MapReduce is awkward for iterative workloads (must re-read full data each iteration); BSP-style systems (Pregel, Giraph, GraphX) are purpose-built."}, {"term": "Output of batch jobs", "def": "Often: search indexes (build offline, swap atomically), ML model files, summary tables, recommendation data.", "why": "Batch is good when you can tolerate seconds-to-hours staleness and value determinism."}], "cheatsheet": [{"title": "Join strategies", "type": "table", "headers": ["Strategy", "When to use", "Cost", "Requires"], "rows": [["Reduce-side (sort-merge)", "General case, either side large", "Full shuffle of both sides", "Nothing special"], ["Broadcast (map-side)", "One side small (fits in RAM)", "Ship small side to each mapper", "Small input"], ["Partitioned map-side", "Both pre-partitioned on join key", "Join each partition locally", "Coordinated partitioning"], ["Merge join (map-side)", "Both partitioned AND sorted", "Stream & merge", "Partitioned + sorted inputs"]]}, {"title": "MapReduce vs Dataflow engines (Spark/Flink)", "type": "table", "headers": ["", "MapReduce", "Spark/Flink (dataflow)"], "rows": [["Model", "Map &rarr; Reduce only", "Arbitrary DAG of operators"], ["Intermediate state", "Written to HDFS each stage", "In-memory, spills on overflow"], ["Fault tolerance", "Re-run failed tasks from HDFS", "Lineage + checkpoints"], ["Iterative workloads", "Slow (re-read each iter)", "Fast (cache datasets)"], ["API", "Low-level Map/Reduce", "High-level (SQL, DataFrames, RDDs)"]]}, {"title": "Unix philosophy &harr; big-data patterns", "type": "list", "items": ["<strong>One thing well</strong> = each MapReduce stage does one transformation", "<strong>Text streams</strong> = records flowing between stages", "<strong>Composability</strong> = pipe output of one job as input to the next", "<strong>Immutable inputs</strong> = HDFS files don't change; re-runnable", "<strong>No shared state</strong> = each worker pure function &mdash; trivial to parallelize"]}], "interview": [{"q": "Explain MapReduce at a high level.", "diff": "easy", "a": "<p>MapReduce is a programming model for distributed batch processing. You write two pure functions:</p><ul><li><strong>Mapper</strong>: runs per input record, emits zero or more (key, value) pairs.</li><li><strong>Reducer</strong>: runs per key, receives the list of all values for that key, emits output records.</li></ul><p>Between them, the framework <strong>shuffles</strong>: sorts and partitions outputs by key so each reducer gets all values for its keys. Framework also handles parallelism, task placement (near the data), and fault tolerance (retry failed tasks).</p><p>Classic example: word count. Mapper emits (word, 1) per token; reducer sums the counts per word.</p>"}, {"q": "Compare reduce-side and map-side joins.", "diff": "hard", "a": "<p><strong>Reduce-side join</strong>: both inputs tagged with the join key and shuffled; at the reducer, all records with a given key from both sides arrive together and get joined. Works in all cases but requires a full shuffle of both sides &mdash; expensive.</p><p><strong>Map-side join</strong> has three flavors:</p><ul><li><strong>Broadcast</strong>: small side fits in RAM &rarr; ship it to every mapper; mapper streams the large side and looks up in the in-memory small side. No shuffle.</li><li><strong>Partitioned</strong>: both inputs pre-partitioned on the join key (by an upstream job) &rarr; each mapper joins one pair of matching partitions.</li><li><strong>Merge join</strong>: both partitioned AND sorted &rarr; stream both in sorted order, merge.</li></ul><p>Map-side joins are much faster when the preconditions hold &mdash; especially broadcast for star-schema (big fact &times; small dimension).</p>"}, {"q": "Why is Spark typically faster than MapReduce?", "diff": "medium", "a": "<p>Several reasons:</p><ul><li><strong>In-memory intermediate state</strong>: MapReduce writes every stage's output to HDFS (disk + network replication). Spark keeps it in RAM, spilling only on overflow.</li><li><strong>Arbitrary DAGs</strong>: Spark can fuse operators and schedule multiple transformations without materializing in between.</li><li><strong>Lineage-based fault tolerance</strong>: Spark can recompute lost partitions from source data via the RDD lineage graph, without needing to persist every intermediate step.</li><li><strong>Cached datasets</strong>: iterative algorithms (ML, graph) can reuse data across iterations instead of re-reading.</li></ul><p>Order of magnitude speedup (often 10&ndash;100&times;) on iterative workloads and multi-stage jobs.</p>"}, {"q": "How does HDFS achieve fault tolerance and throughput?", "diff": "medium", "a": "<p>Files are split into large blocks (typically 128MB or 256MB), each replicated to 3 nodes (configurable). NameNode holds the metadata; DataNodes hold the blocks.</p><p><strong>Fault tolerance</strong>: if a node dies, missing blocks are re-replicated from surviving copies. Reads can use any replica.</p><p><strong>Throughput</strong>: big blocks minimize seek overhead; readers stream sequentially. Jobs are scheduled to run on nodes holding the data (<em>data locality</em>), avoiding network transfers.</p><p>Drawbacks: tiny files are wasteful (block metadata overhead); NameNode is a SPOF in older versions. S3 / GCS replaced HDFS in many cloud deployments because they scale storage independently of compute.</p>"}, {"q": "When would you pick batch over streaming?", "diff": "medium", "a": "<p>Batch wins when:</p><ul><li>You can tolerate minutes-to-hours latency.</li><li>You want <strong>deterministic, rerunnable</strong> processing (critical for backfills and debugging).</li><li>You need to process <em>all</em> of a dataset for correctness (joins, aggregates across a day).</li><li>You want cheap storage for historical data and cheap compute via scale-out.</li></ul><p>Streaming wins when:</p><ul><li>Seconds/milliseconds latency required.</li><li>Data is naturally a continuous feed (clicks, sensors).</li><li>You want alerts or real-time dashboards.</li></ul><p>Many modern systems are hybrid (\"lambda\") or use stream processing for both (\"kappa\") &mdash; discussed in Ch 11-12.</p>"}, {"q": "What is a workflow engine and why do you need one?", "diff": "easy", "a": "<p>A workflow engine (Airflow, Luigi, Oozie, Dagster, Prefect) orchestrates a <strong>DAG of jobs</strong>: scheduling, dependency management, retries on failure, partial backfills, SLA monitoring.</p><p>Why needed: real pipelines are dozens or hundreds of jobs that depend on each other. Writing cron jobs and state-tracking scripts yourself becomes a second system. Workflow engines provide:</p><ul><li>Declarative DAG definitions</li><li>Dependency resolution (\"don't run B until A succeeded for this date\")</li><li>Retry policies, alerting</li><li>UI for observability</li><li>Backfills (re-run a window after a fix)</li></ul>"}, {"q": "Why are high-level APIs (Hive, Spark SQL) preferred over raw MapReduce/RDDs?", "diff": "medium", "a": "<p>Because they're <strong>declarative</strong>. You write SQL (or a DataFrame expression), the engine:</p><ul><li>Picks join algorithms (broadcast vs shuffle, merge vs hash).</li><li>Pushes down predicates to scan less data.</li><li>Reorders operations for efficiency.</li><li>Uses column statistics to pick plans.</li></ul><p>You don't have to know whether the right thing is a map-side broadcast or a reduce-side merge &mdash; the engine figures it out. Plus, SQL is familiar to many more people than RDD APIs.</p><p>Under the hood it all compiles to the same physical primitives. The same job in raw MapReduce code vs SQL is often 100+ lines vs 5, with equal or better performance.</p>"}, {"q": "What is iterative processing and why is MapReduce bad at it?", "diff": "hard", "a": "<p>Iterative algorithms (PageRank, k-means, graph BFS) repeatedly apply the same transformation until convergence. Each iteration depends on the previous one.</p><p>MapReduce problem: every iteration is a separate job. Input is read from HDFS, written to HDFS, read again for the next iteration. Huge I/O overhead for many iterations.</p><p>Better approaches:</p><ul><li><strong>Spark</strong>: cache the dataset in RAM; iterations just apply transformations to the cached RDD.</li><li><strong>Pregel-style (BSP)</strong> graph processing: each vertex has state and processes messages per superstep &mdash; natural fit for iterative graph algos. Giraph, GraphX, Pregel.</li></ul>"}]}, {"id": "ch11", "part": 3, "number": 11, "title": "Stream Processing", "overview": "<p>Unbounded data: events arriving continuously, processed as they come. The chapter compares <strong>traditional messaging brokers</strong> (AMQP/JMS, RabbitMQ) with <strong>log-based brokers</strong> (Kafka), where events are a durable partitioned log that can be replayed.</p><p>Then connects streams to databases via <strong>change data capture (CDC)</strong> and <strong>event sourcing</strong> &mdash; treating a log of changes as the source of truth.</p><p>Stream operations: joins (stream-stream, stream-table, table-table), windowing, watermarks, and fault tolerance (exactly-once via idempotence + checkpointing).</p>", "concepts": [{"term": "Event stream", "def": "An unbounded sequence of <strong>events</strong> &mdash; small, immutable, timestamped records representing something that happened. Producers emit, consumers process.", "why": "Natural fit for click streams, sensor data, financial transactions, application events."}, {"term": "Messaging system / broker", "def": "Middleware that buffers messages between producers and consumers. Two families: <strong>transient</strong> (AMQP/JMS: RabbitMQ, ActiveMQ &mdash; delete on ack) and <strong>log-based</strong> (Kafka: durable log, consumers track offsets).", "why": "Decouple producers and consumers in time; buffer, fan out, retry."}, {"term": "AMQP/JMS-style broker", "def": "Queue-based: messages delivered to one consumer in a group; acknowledged; deleted. Good for task queues, not replayable.", "why": "Simple, low-latency. Bad when you want replay, multiple independent consumers, or to retain history.", "ex": "RabbitMQ, ActiveMQ, SQS (loosely)."}, {"term": "Log-based broker (Kafka)", "def": "Partitioned, durable, append-only logs. Consumers read by offset; broker doesn't delete on read.", "why": "Allows <em>replay</em>, multiple independent consumer groups, reliable ordered delivery within a partition.", "ex": "Kafka, Pulsar, Kinesis."}, {"term": "Partitioned log", "def": "A topic split into N partitions, each an ordered log. Messages to the same key go to the same partition (preserving per-key order).", "why": "Parallelism + per-key ordering; horizontal scale."}, {"term": "Consumer group & offsets", "def": "Consumers coordinate via groups. Each partition is assigned to exactly one consumer in the group. Each tracks its <strong>offset</strong> (n
