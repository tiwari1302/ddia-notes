<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDIA Interactive Notes - Interview Prep</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1020;
    --bg-2: #111831;
    --bg-3: #1a2342;
    --border: #243056;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #8b5cf6;
    --accent-2: #06b6d4;
    --accent-3: #f59e0b;
    --good: #10b981;
    --bad: #ef4444;
    --easy: #10b981;
    --med: #f59e0b;
    --hard: #ef4444;
  }
  body.light {
    --bg: #f8fafc;
    --bg-2: #ffffff;
    --bg-3: #f1f5f9;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #475569;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  code, pre {
    font-family: "SF Mono", Monaco, Menlo, Consolas, monospace;
    background: var(--bg-3);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }
  pre { padding: 12px; overflow-x: auto; }

  /* Top bar */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg-2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: white; font-weight: 900;
  }
  .brand-sub { color: var(--text-muted); font-weight: 400; font-size: 13px; margin-left: 4px;}
  .topbar-spacer { flex: 1; }
  .search-box {
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    width: 320px;
    font-size: 14px;
    outline: none;
  }
  .search-box:focus { border-color: var(--accent); }
  .iconbtn {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .iconbtn:hover { background: var(--accent); color: white; border-color: var(--accent);}
  .progress-pill {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 13px;
  }
  .progress-pill-bar {
    width: 100px; height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress-pill-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    flex: 1;
    min-height: 0;
  }
  .sidebar {
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 16px;
    max-height: calc(100vh - 61px);
    position: sticky;
    top: 61px;
  }
  .main {
    padding: 32px 48px;
    max-width: 1100px;
    width: 100%;
  }

  /* Sidebar */
  .part-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    padding: 16px 8px 8px;
    font-weight: 700;
  }
  .chapter-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 2px;
  }
  .chapter-item:hover { background: var(--bg-3); }
  .chapter-item.active {
    background: linear-gradient(90deg, rgba(139,92,246,0.2), rgba(6,182,212,0.1));
    border-left: 3px solid var(--accent);
    padding-left: 9px;
  }
  .chapter-num {
    min-width: 24px; height: 24px;
    background: var(--bg-3);
    color: var(--text-muted);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
  }
  .chapter-item.active .chapter-num {
    background: var(--accent);
    color: white;
  }
  .chapter-title { flex: 1; }
  .chapter-ring {
    width: 18px; height: 18px;
    position: relative;
  }
  .chapter-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .chapter-ring circle { fill: none; stroke-width: 3; }
  .chapter-ring .bg { stroke: var(--border); }
  .chapter-ring .fg { stroke: var(--good); transition: stroke-dashoffset 0.3s; }
  .chapter-ring.done .check {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--good);
  }

  /* Main content */
  .chapter-header {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .chapter-label {
    font-size: 12px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 700;
  }
  .chapter-header h1 {
    font-size: 32px;
    margin: 8px 0 12px;
    line-height: 1.2;
  }
  .overview-text {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.7;
  }
  .overview-text p { margin-bottom: 10px; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
    overflow-x: auto;
  }
  .tab {
    background: none;
    border: none;
    color: var(--text-muted);
    padding: 12px 18px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }
  .tab-count {
    display: inline-block;
    background: var(--bg-3);
    border-radius: 999px;
    padding: 2px 8px;
    font-size: 11px;
    margin-left: 6px;
  }

  /* Concept cards */
  .concepts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .concept-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all 0.2s;
    position: relative;
  }
  .concept-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 20px rgba(139,92,246,0.15);
  }
  .concept-card.learned {
    border-color: var(--good);
    background: linear-gradient(135deg, var(--bg-2), rgba(16,185,129,0.05));
  }
  .concept-term {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent-2);
    margin-bottom: 10px;
    padding-right: 40px;
  }
  .concept-def {
    font-size: 14px;
    margin-bottom: 12px;
  }
  .concept-why, .concept-example {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
  }
  .concept-why::before { content: "Why it matters: "; font-weight: 600; color: var(--accent-3); }
  .concept-example::before { content: "Example: "; font-weight: 600; color: var(--accent-2); }
  .learn-toggle {
    position: absolute;
    top: 16px; right: 16px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--good);
    font-size: 14px;
    transition: all 0.15s;
  }
  .learn-toggle:hover { border-color: var(--good); }
  .learn-toggle.on {
    background: var(--good);
    border-color: var(--good);
    color: white;
  }

  /* Cheatsheet */
  .cheatsheet-block {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .cheatsheet-block h3 {
    font-size: 16px;
    margin-bottom: 14px;
    color: var(--accent-2);
  }
  .cheatsheet-block table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .cheatsheet-block th, .cheatsheet-block td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .cheatsheet-block th {
    background: var(--bg-3);
    font-weight: 600;
    color: var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .cheatsheet-block tr:last-child td { border-bottom: none; }
  .cheatsheet-block ul {
    margin-left: 20px;
    font-size: 14px;
  }
  .cheatsheet-block li { margin-bottom: 6px; }
  .cs-note {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 10px;
    font-style: italic;
  }

  /* Interview Q&A */
  .qa-item {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .qa-item.reviewed { border-color: var(--good); }
  .qa-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .qa-header:hover { background: var(--bg-3); }
  .qa-q {
    flex: 1;
    font-weight: 600;
    font-size: 15px;
  }
  .diff-badge {
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .diff-easy { background: rgba(16,185,129,0.15); color: var(--easy); }
  .diff-med { background: rgba(245,158,11,0.15); color: var(--med); }
  .diff-hard { background: rgba(239,68,68,0.15); color: var(--hard); }
  .qa-chevron {
    color: var(--text-muted);
    transition: transform 0.2s;
  }
  .qa-item.open .qa-chevron { transform: rotate(180deg); }
  .qa-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease;
  }
  .qa-item.open .qa-body {
    max-height: 3000px;
  }
  .qa-body-inner {
    padding: 0 20px 20px;
    font-size: 14px;
    color: var(--text);
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .qa-body-inner p { margin-bottom: 10px; }
  .qa-body-inner ul, .qa-body-inner ol { margin: 10px 0 10px 24px; }
  .qa-body-inner li { margin-bottom: 6px; }
  .qa-footer {
    display: flex;
    justify-content: flex-end;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
  }
  .review-btn {
    background: var(--bg-3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .review-btn.on {
    background: var(--good);
    color: white;
    border-color: var(--good);
  }

  /* Flashcards */
  .fc-controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .fc-stage {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 320px;
    perspective: 1200px;
    margin-bottom: 20px;
  }
  .flashcard {
    width: min(520px, 100%);
    height: 300px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
    cursor: pointer;
  }
  .flashcard.flipped { transform: rotateY(180deg); }
  .fc-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow-y: auto;
  }
  .fc-front {
    background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
    border-color: var(--accent);
  }
  .fc-back {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, var(--bg-2), rgba(6,182,212,0.1));
    border-color: var(--accent-2);
  }
  .fc-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .fc-front .fc-content { font-size: 20px; font-weight: 600; }
  .fc-back .fc-content { font-size: 15px; text-align: left; line-height: 1.7; }
  .fc-back .fc-content ul { margin-left: 20px; margin-top: 8px;}
  .fc-back .fc-content li { margin-bottom: 4px; }
  .fc-nav { display: flex; gap: 10px; justify-content: center; align-items: center; }
  .fc-counter {
    color: var(--text-muted);
    font-size: 14px;
    min-width: 60px;
    text-align: center;
  }

  /* Dashboard (first page) */
  .dash-hero {
    background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(6,182,212,0.1));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 28px;
  }
  .dash-hero h1 { font-size: 28px; margin-bottom: 8px;}
  .dash-hero p { color: var(--text-muted); font-size: 15px; }
  .dash-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 28px; font-weight: 700; margin-top: 6px;}
  .stat-value .small { font-size: 16px; color: var(--text-muted); font-weight: 400;}

  .dash-chapters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .dash-chapter-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .dash-chapter-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }
  .dcc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px;}
  .dcc-num {
    width: 28px; height: 28px;
    background: var(--bg-3);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 12px;
    color: var(--accent);
  }
  .dcc-title { font-weight: 600; font-size: 14px; flex: 1;}
  .dcc-prog-bar {
    height: 5px;
    background: var(--bg-3);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }
  .dcc-prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
  }
  .dcc-meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  /* Search results */
  .search-results {
    position: absolute;
    top: 46px; right: 0;
    width: 420px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    max-height: 400px;
    overflow-y: auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    display: none;
    z-index: 200;
  }
  .search-results.open { display: block; }
  .sr-item {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .sr-item:hover { background: var(--bg-3); }
  .sr-label { color: var(--accent); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;}
  .sr-title { font-weight: 600; }
  .sr-snippet { color: var(--text-muted); margin-top: 4px; font-size: 12px; }

  .search-wrap { position: relative; }

  /* Misc */
  .empty-tab { color: var(--text-muted); padding: 24px; text-align: center;}
  kbd {
    font-family: "SF Mono", Monaco, monospace;
    background: var(--bg-3);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
  }
  .chapter-footer {
    margin-top: 40px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .nav-btn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    color: var(--text);
    font-size: 14px;
    flex: 1;
    max-width: 300px;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); background: var(--bg-3); }
  .nav-btn.right { text-align: right; }
  .nav-btn-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }

  /* Responsive */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; top: 0; max-height: none; }
    .main { padding: 20px; }
    .search-box { width: 180px; }
    .search-results { width: 300px; right: -40px;}
  }

  .hl { background: rgba(139,92,246,0.25); padding: 0 2px; border-radius: 3px;}
  .mono { font-family: "SF Mono", Monaco, monospace; font-size: 0.92em; }
  .tag {
    display: inline-block;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 11px;
    margin-right: 6px;
    color: var(--text-muted);
  }
  .tag.strong { background: rgba(139,92,246,0.15); color: var(--accent); border-color: var(--accent);}

  /* Scrollbars */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px;}
  ::-webkit-scrollbar-thumb:hover { background: var(--accent);}
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">D</div>
      DDIA Notes
      <span class="brand-sub">Interactive interview prep</span>
    </div>
    <div class="topbar-spacer"></div>
    <div class="progress-pill" title="Overall progress across all chapters">
      <span id="overallProgressText">0%</span>
      <div class="progress-pill-bar"><div class="progress-pill-fill" id="overallProgressFill" style="width:0%"></div></div>
    </div>
    <div class="search-wrap">
      <input type="text" class="search-box" id="searchBox" placeholder="Search concepts, questions... (press /)" />
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="iconbtn" id="exportBtn" title="Export your progress to a file (so you can import it on another device)">⬇ Export</button>
    <button class="iconbtn" id="importBtn" title="Import progress from a file">⬆ Import</button>
    <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
    <button class="iconbtn" id="themeToggle" title="Toggle theme">Light</button>
    <button class="iconbtn" id="resetBtn" title="Reset all progress">Reset</button>
  </div>

  <div id="toast" style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--bg-2);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,0.3);opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:500;"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>

<script>
// ============================================================
// DATA: DDIA chapters
// ============================================================
const DATA = {"chapters": [{"id": "ch1", "part": 1, "number": 1, "title": "Reliable, Scalable, and Maintainable Applications", "overview": "<p>This chapter frames the whole book. Modern applications are <em>data-intensive</em> rather than compute-intensive &mdash; they combine databases, caches, search indexes, message queues, batch processors, etc. &mdash; and engineers compose these building blocks into larger systems.</p><p>Kleppmann introduces three concerns every such system must address: <strong>reliability</strong> (works correctly despite faults), <strong>scalability</strong> (handles growth in load/data/complexity), and <strong>maintainability</strong> (productively evolvable by many people over time).</p><p>Percentiles (p50/p95/p99/p999), load parameters, tail latency amplification, and the Twitter home-timeline example are introduced here.</p>", "concepts": [{"term": "Reliability", "def": "A system continues to perform its expected function correctly, even in the face of adversity (hardware faults, software errors, human mistakes).", "why": "Reliability is the floor &mdash; without it, nothing else matters.", "ex": "Netflix's Chaos Monkey deliberately kills instances in production to force engineers to design for failure."}, {"term": "Fault vs Failure", "def": "A <strong>fault</strong> is a single component deviating from spec; a <strong>failure</strong> is the whole system stopping service. Fault-tolerant systems prevent faults from becoming failures.", "why": "You can't prevent all faults, but you can stop them from cascading. Design for faults, measure failures."}, {"term": "Hardware, software & human faults", "def": "Three fault classes: hardware (disk crashes, power loss), software (bugs, runaway processes, cascading failures from shared bugs), human (config errors, which dominate outages).", "why": "Each class needs different mitigations: redundancy for hardware, rigorous testing & monitoring for software, sandboxes/training/fast rollback for human."}, {"term": "Scalability", "def": "A system's ability to cope with increased load. You describe <em>load</em> with load parameters (RPS, read/write ratio, cache hit rate, fanout), and <em>performance</em> with response-time percentiles.", "why": "Scalability isn't binary. Always ask: \"If load grows in dimension X, what are our options?\""}, {"term": "Load parameters", "def": "Numbers that describe the current load on a system: requests/sec to a web server, reads/writes ratio in a DB, simultaneously active users, cache hit rate, or (for Twitter) the <em>fanout</em> per tweet.", "why": "You can't reason about scaling without naming the bottleneck dimension.", "ex": "Twitter home timeline: ~300k reads/sec for timeline, but only ~4.6k writes/sec. Fanout (avg followers per tweet author) = dominant cost."}, {"term": "Response time vs latency", "def": "<strong>Response time</strong> is what the client sees (service time + network + queueing). <strong>Latency</strong> is the duration a request is waiting to be handled.", "why": "Latency is commonly conflated with response time; the book is precise because the distinction matters when queueing dominates."}, {"term": "Percentiles (p50, p95, p99, p999)", "def": "Median (p50) is typical; tail percentiles (p99, p99.9) capture the worst user experiences. High-value users often hit the tail because they generate more requests.", "why": "Averages hide outliers. SLOs/SLAs are defined in percentiles. Amazon found 100ms of extra p99 latency reduces sales by 1%.", "ex": "If p99 = 1.5s and you make 100 requests/page, the probability of at least one slow request approaches 63%."}, {"term": "Tail latency amplification", "def": "When one user request fans out into many parallel backend calls, the slowest sub-call determines the end-to-end latency &mdash; so tail percentiles of sub-services drive the p50 of the whole.", "why": "Even if only 1% of a service's calls are slow, a request that hits 100 of them will almost always be slow."}, {"term": "Scaling up vs scaling out", "def": "<strong>Vertical (up)</strong>: bigger machine, simpler but limited by the biggest machine you can buy. <strong>Horizontal (out)</strong>: add more machines, harder to distribute state.", "why": "Stateless services scale out easily; stateful ones (databases) require partitioning/replication, which is the rest of the book.", "ex": "Elastic systems auto-scale out; other systems are manually scaled but have simpler operational models."}, {"term": "Maintainability", "def": "Designing software so that working on it in the future isn't miserable. Three sub-principles: <strong>operability</strong>, <strong>simplicity</strong>, <strong>evolvability</strong>.", "why": "Most of a system's cost is maintenance. Good initial design pays compound interest."}, {"term": "Operability", "def": "Making life easy for operations: good monitoring, runbooks, predictable behavior, self-healing where possible, understandable alerts.", "why": "Ops teams are force multipliers. A system that's hard to operate degrades faster than its code rots."}, {"term": "Simplicity (managing complexity)", "def": "Reducing <em>accidental</em> complexity &mdash; complexity not inherent to the problem but imposed by tools/abstractions. Good abstractions hide implementation without lying about their properties.", "why": "Complex systems are harder to test, understand, and evolve. Simplicity is a feature."}, {"term": "Evolvability (extensibility)", "def": "The ease with which engineering teams can adapt the system to new requirements. Closely tied to simplicity and agile working practices.", "why": "Requirements always change; the question is whether the system bends or breaks when they do."}, {"term": "Twitter home timeline", "def": "Classic scalability case study. Two approaches: (1) compute timeline on read by querying followees, or (2) maintain a materialized inbox per user via fanout on write.", "why": "Illustrates the read vs write tradeoff. Twitter ultimately used a hybrid: fanout on write for most users, fanout on read for celebrities (millions of followers).", "ex": "A user who posts once and has 100M followers would require 100M inserts if purely fanout-on-write &mdash; prohibitively expensive."}], "cheatsheet": [{"title": "Fault types and their defenses", "type": "table", "headers": ["Fault class", "Examples", "Defenses"], "rows": [["Hardware", "Disk, RAM, power, network", "Redundancy (RAID, dual PSU, multi-AZ), rolling restarts"], ["Software", "Bugs that fire on all nodes, runaway GC, cascading failures", "Careful testing, isolation, monitoring, measure/alert on anomalies"], ["Human", "Misconfig, bad deploy", "Sandboxes, staging envs, canary deploys, fast rollback, training, blameless post-mortems"]]}, {"title": "Describing performance", "type": "list", "items": ["<strong>Load</strong>: RPS, read/write ratio, concurrent users, cache hit rate, fanout", "<strong>Performance</strong>: response-time distribution &mdash; not just mean", "<strong>Percentiles</strong> over mean: p50 (median) for typical, p95/p99/p99.9 for tail", "<strong>SLO/SLA</strong> expressed as \"p99 &lt; X ms with 99.9% uptime\"", "<strong>Queueing theory</strong>: once utilization &gt; ~70%, response time explodes; plan for headroom"]}, {"title": "Twitter timeline: two approaches", "type": "table", "headers": ["Approach", "Read cost", "Write cost", "When to use"], "rows": [["Fan-out on read (pull)", "Expensive: query many followees at read time", "Cheap", "When reads are rare, writes are heavy, or user has many followees"], ["Fan-out on write (push)", "Cheap: inbox already materialized", "Expensive: insert into every follower's inbox", "When reads are much more common than writes (typical)"], ["Hybrid (what Twitter did)", "Cheap for normal users; compute-on-read for celebs", "Cheap for normal users; skip for celebs", "Skewed fan-out: handful of users dominate write cost"]], "note": "Key takeaway: pick the technique per load parameter, not per system."}], "interview": [{"q": "What is the difference between reliability, scalability, and maintainability?", "diff": "easy", "a": "<p><strong>Reliability</strong> = continues to work correctly despite faults (hardware, software, human). <strong>Scalability</strong> = ability to handle growth in load, data, or complexity. <strong>Maintainability</strong> = can be productively worked on by many engineers over time, which decomposes into operability, simplicity, and evolvability.</p><p>They often trade off: a highly available multi-region system is more reliable but harder to operate; simple single-node systems are easy to maintain but don't scale.</p>"}, {"q": "Why do we prefer percentiles over averages for measuring performance?", "diff": "easy", "a": "<p>Averages are dominated by bulk traffic and hide the tail &mdash; yet the tail is what drives user pain and SLA breaches. A service can have a great mean response time while 1% of users are experiencing timeouts.</p><ul><li><strong>p50 (median)</strong>: typical user experience</li><li><strong>p95/p99</strong>: user pain; captures what the worst common-case requests look like</li><li><strong>p999</strong>: your most valuable users (who send the most requests) see these</li></ul><p>Amazon and Google cite percentiles in SLOs explicitly because a ~100ms regression in p99 can measurably reduce revenue.</p>"}, {"q": "Explain tail latency amplification with an example.", "diff": "medium", "a": "<p>When a single user request fans out into many parallel backend calls, the overall latency is dominated by the slowest sub-call. Even if each sub-call has only a 1% chance of being slow (p99 = slow), a request making 100 of them will <em>almost certainly</em> hit at least one slow one: P(at least one slow) = 1 - 0.99^100 &asymp; 63%.</p><p>Real example: a search query might hit hundreds of index shards; the user waits for the slowest shard. This is why reducing tail latency (not average) is critical in microservices.</p><p>Mitigations: hedged requests (issue duplicate to a second replica if first is slow), tail-tolerant systems, reducing fanout, per-subsystem SLOs.</p>"}, {"q": "Walk me through the Twitter home timeline problem and how you would scale it.", "diff": "hard", "a": "<p>Core tension: ~4.6k tweets/sec (writes) vs ~300k timeline reads/sec &mdash; reads are ~65&times; more frequent. Two approaches:</p><ol><li><strong>Fanout on read (pull model)</strong>: on read, query all users the viewer follows and merge tweets. Simple, cheap writes, but read cost scales with follow-graph size &mdash; prohibitive at 300k RPS.</li><li><strong>Fanout on write (push model)</strong>: maintain a materialized \"inbox\" per user. On a tweet, insert into every follower's inbox. Reads are O(1) &mdash; just read inbox. But a celebrity with 100M followers would trigger 100M writes per tweet.</li></ol><p>Twitter's <strong>hybrid</strong>: fanout on write for normal users, fanout on read for celebrities (merged at read time into the inbox). Best of both.</p><p>This illustrates a recurring pattern: when load is skewed, you often need <em>different</em> strategies for the head vs tail of the distribution.</p>"}, {"q": "What is the difference between a fault and a failure?", "diff": "easy", "a": "<p>A <strong>fault</strong> is one component of the system deviating from spec (a disk fails, a process crashes, a packet is dropped). A <strong>failure</strong> is the whole system stopping to provide its service to users. A fault-tolerant or resilient system is one where faults don't escalate into failures. Redundancy, retries, circuit breakers, and graceful degradation are the tools.</p>"}, {"q": "What is the difference between scaling up and scaling out? When would you pick each?", "diff": "medium", "a": "<p><strong>Scaling up (vertical)</strong>: bigger machine (more CPU, RAM, disk). Simpler: no partitioning, no distributed consensus, single-node semantics. Limited by the largest machine available and by cost non-linearity at the top.</p><p><strong>Scaling out (horizontal)</strong>: more machines. Required past a certain scale, especially for bandwidth and storage. Introduces distributed-systems problems: partitioning, replication, consistency, coordination.</p><p>Rule of thumb: scale up until you can't, because distributed systems are hard. Stateless services are easy to scale out; stateful ones need careful design (rest of the book).</p>"}, {"q": "What makes a system maintainable?", "diff": "medium", "a": "<p>Kleppmann identifies three design principles:</p><ul><li><strong>Operability</strong>: easy for operators &mdash; good monitoring, runbooks, predictable behavior, self-healing where possible, good docs, meaningful alerts.</li><li><strong>Simplicity</strong>: minimize accidental complexity &mdash; the complexity not inherent to the problem but introduced by tools/abstractions. Good abstractions hide implementation without lying about their properties.</li><li><strong>Evolvability</strong>: easy to change &mdash; make requirement shifts a bend, not a break. Tied to test coverage, clear module boundaries, and schema evolution.</li></ul><p>Most system cost is maintenance, not development, so these pay off hugely long-term.</p>"}, {"q": "How would you choose load parameters for a new system?", "diff": "medium", "a": "<p>Load parameters depend on the system's architecture and bottleneck, not a generic list. For a web app: RPS, unique users, request size. For a database: read/write ratio, active connections, working-set size vs RAM. For a messaging system: messages/sec and fanout. For a batch system: input size, parallelism, and output fanout.</p><p>Method: identify what dominates cost, then choose a parameter that captures it. For Twitter, the key insight is that the <em>distribution</em> of followers-per-user (fanout) dominates &mdash; not raw tweet volume.</p>"}]}, {"id": "ch2", "part": 1, "number": 2, "title": "Data Models and Query Languages", "overview": "<p>Data models shape how you think. This chapter compares the three dominant paradigms: the <strong>relational model</strong> (tables, rows, SQL), the <strong>document model</strong> (self-contained JSON/BSON records), and the <strong>graph model</strong> (nodes and edges, rich traversal).</p><p>Kleppmann traces the rise of NoSQL: scaling, schema flexibility, specialized queries, and the object-relational impedance mismatch. He argues these models aren't mutually exclusive &mdash; they occupy different ergonomic niches.</p><p>Then query languages: imperative vs declarative, SQL, MapReduce (a hybrid), and declarative graph languages like Cypher and SPARQL.</p>", "concepts": [{"term": "Relational model", "def": "Data organized in <em>relations</em> (tables) of tuples (rows), queried declaratively via SQL. Joins handle relationships between entities.", "why": "Dominant for 40+ years because joins and ACID are genuinely useful for business data with relationships and constraints."}, {"term": "Document model", "def": "Self-contained records (typically JSON) stored as a tree. Good for one-to-many data that is loaded together (e.g., a resume with its list of jobs).", "why": "Better locality (one read vs many joins), schema flexibility, fits object-oriented code more naturally.", "ex": "MongoDB, CouchDB, DynamoDB."}, {"term": "Graph model", "def": "Nodes connected by labeled edges. Two main flavors: <strong>property graph</strong> (Neo4j, Cypher) and <strong>triple-store</strong> (RDF, SPARQL).", "why": "Excels at highly interconnected data and multi-hop queries (friends-of-friends, recommendations, genealogies)."}, {"term": "Object-relational impedance mismatch", "def": "The friction between object-oriented code (nested objects, collections) and the flat tables of relational DBs, typically handled by ORMs.", "why": "A classic motivation for document DBs: a resume is naturally a tree, and the document model keeps it as one."}, {"term": "Many-to-one / many-to-many", "def": "Relational natively handles these via foreign keys and JOINs. Document model handles one-to-many well but many-to-many requires denormalization or application-side joins.", "why": "As soon as your data has many-to-many (users &harr; groups, tags &harr; posts), relational becomes more natural again."}, {"term": "Schema-on-read vs schema-on-write", "def": "<strong>Schema-on-write</strong> (relational): schema is defined and enforced at write time. <strong>Schema-on-read</strong> (document): structure is interpreted when read; new fields just appear.", "why": "Schema-on-read is convenient for fast iteration; schema-on-write catches errors earlier and documents intent. Don't confuse \"schemaless\" with \"no implicit schema\".", "ex": "Adding a new field: document DB = just write it; relational = ALTER TABLE + migration (often fast in modern DBs)."}, {"term": "Normalization", "def": "Decomposing data to remove redundancy, using IDs for references rather than duplicating values. E.g., storing city_id instead of \"San Francisco\" everywhere.", "why": "Avoids update anomalies, supports consistent rename, enables joins. But requires joins on read."}, {"term": "Denormalization", "def": "Duplicating data intentionally for read performance. Common in document DBs (embed frequently read child objects) and analytics.", "why": "Trades write complexity and storage for read speed; must carefully manage update propagation."}, {"term": "Declarative vs imperative query", "def": "<strong>Declarative</strong> (SQL, Cypher) states <em>what</em> you want; the engine decides how. <strong>Imperative</strong> states the algorithm step-by-step.", "why": "Declarative lets the engine optimize (push down predicates, parallelize, pick indexes) without changing code."}, {"term": "MapReduce querying", "def": "A programming model where you supply two pure functions: a <em>mapper</em> emits key-value pairs from each record, a <em>reducer</em> aggregates values by key.", "why": "Runs on massive parallelism, but more cumbersome than SQL. MongoDB's aggregation pipeline largely replaced its MapReduce."}, {"term": "Property graph", "def": "Nodes and directed edges both have labels and key-value properties. Queried with languages like <strong>Cypher</strong>.", "why": "Very expressive; allows complex traversals in a compact syntax: MATCH (a)-[:FRIEND]-&gt;(b)-[:FRIEND]-&gt;(c) RETURN c."}, {"term": "Triple-store / RDF / SPARQL", "def": "Data as (subject, predicate, object) triples. <strong>SPARQL</strong> is the query language. <strong>RDF</strong> was designed for the semantic web.", "why": "Flexible schema-less structure, good interchange format; conceptually similar to property graphs."}, {"term": "Datalog", "def": "An older logic-programming query language (rules over facts). Cypher and SPARQL descend from it conceptually.", "why": "Reasoning by rules enables inference and derived facts; cleaner for recursive relationships than SQL."}, {"term": "CODASYL / network model", "def": "1970s pre-relational model with nested records and explicit pointers between records. Required the programmer to walk the graph manually.", "why": "Historical parallel: document databases reintroduce some of its issues when relationships become many-to-many."}], "cheatsheet": [{"title": "Relational vs Document vs Graph", "type": "table", "headers": ["Dimension", "Relational", "Document", "Graph"], "rows": [["Shape", "Flat tables + joins", "Self-contained trees", "Nodes + edges"], ["Schema", "Enforced on write", "On read (implicit)", "Flexible"], ["Locality", "Many joins = many seeks", "Whole doc in one read", "Traversal via edges"], ["Many-to-many", "Natural (JOINs)", "Awkward (app-side joins)", "Excellent"], ["Ad-hoc queries", "Excellent (SQL)", "Limited", "Good (Cypher/SPARQL)"], ["Best fit", "Business data w/ relationships", "Tree-shaped, self-contained records", "Interconnected graph data"], ["Examples", "Postgres, MySQL, Oracle", "MongoDB, Couch, Dynamo", "Neo4j, JanusGraph, RDF stores"]]}, {"title": "Imperative vs Declarative query", "type": "table", "headers": ["", "Imperative", "Declarative"], "rows": [["You write", "Step-by-step algorithm", "What result you want"], ["Optimization", "Your responsibility", "Engine chooses plan"], ["Parallelism", "Hard (code order matters)", "Easy (engine reorders safely)"], ["Examples", "LINQ fluent methods, low-level code", "SQL, Cypher, SPARQL, Datalog"]]}, {"title": "When to pick each model", "type": "list", "items": ["<strong>Relational</strong>: many entity types, many-to-many relationships, consistency matters, ad-hoc reporting", "<strong>Document</strong>: data is a tree per record, accessed as a unit, schema evolves fast, no deep cross-record joins", "<strong>Graph</strong>: data is a graph (social, fraud, knowledge), queries are multi-hop traversals, relationship types evolve", "<strong>Polyglot persistence</strong> is normal: use each model where it fits"]}], "interview": [{"q": "When would you pick a document database over a relational one?", "diff": "medium", "a": "<p>Pick document when:</p><ul><li>Your data naturally fits a tree (resume + jobs + education) and is accessed as a unit &mdash; better locality, one read instead of many joins.</li><li>Your schema evolves fast and you want schema-on-read flexibility.</li><li>You don't have many-to-many relationships &mdash; document DBs handle those awkwardly (app-side joins or denormalization).</li><li>You need horizontal scale and can partition by document key.</li></ul><p>Stay relational when data is relational (many entities, many joins, many-to-many), when you need ACID across rows, or when ad-hoc queries and joins dominate.</p><p>Rule of thumb: if your data is a tree per record, document is great. If it's a graph (more than trees) or needs complex queries, relational (or graph) is better.</p>"}, {"q": "What is the object-relational impedance mismatch?", "diff": "easy", "a": "<p>Application code is object-oriented (nested objects, collections, inheritance) but relational databases store flat tuples. Every app-DB boundary needs translation &mdash; typically an ORM &mdash; which is often leaky, introduces N+1 query issues, and obscures performance. Document databases largely eliminate this by storing objects in their native shape (JSON).</p>"}, {"q": "What do schema-on-read and schema-on-write mean, and what tradeoffs do they imply?", "diff": "medium", "a": "<p><strong>Schema-on-write</strong> (relational): declared and enforced up-front. Pros: errors caught early, schema is self-documenting, queries can assume shape. Cons: migrations are heavier.</p><p><strong>Schema-on-read</strong> (document): data written freely; structure interpreted at read time. Pros: fast iteration, mixed old and new records coexist. Cons: bugs appear late in production, readers must defensively handle missing/extra fields.</p><p>Important nuance: schema-on-read is not \"no schema\" &mdash; the schema lives implicitly in every piece of code that reads the data. You've just moved enforcement from one place (DB) to many (every reader).</p>"}, {"q": "How does a document DB handle a many-to-many relationship like users-to-groups?", "diff": "medium", "a": "<p>Three common patterns:</p><ol><li><strong>Embed on both sides (denormalized)</strong>: store group_ids in user doc AND user_ids in group doc. Fast reads, but writes must update two documents consistently (no ACID across docs in many document DBs).</li><li><strong>Store IDs, do application-side joins</strong>: user doc has group_ids; when you need the full group object, the app does a second query. N+1 risk.</li><li><strong>Use a separate \"edges\" collection</strong>: essentially reinventing a relational join table.</li></ol><p>All three become uncomfortable compared to a SQL JOIN, which is why many-to-many is the classic \"use relational\" signal.</p>"}, {"q": "Explain declarative vs imperative query languages. Why is SQL declarative?", "diff": "easy", "a": "<p><strong>Imperative</strong> = say HOW: step through records, check conditions, accumulate results. <strong>Declarative</strong> = say WHAT: \"return users with &gt;10 orders last month\".</p><p>SQL is declarative: the engine picks the join algorithm, index, and evaluation order. This lets the DB optimize (push down predicates, parallelize, pick between hash/merge/nested-loop joins) transparently &mdash; your query keeps working when the optimizer improves or when data volume changes.</p><p>With imperative code, parallelization becomes the programmer's problem because ordering dependencies are baked into the code.</p>"}, {"q": "What problem does the graph data model solve that relational struggles with?", "diff": "medium", "a": "<p>Variable-depth traversals over interconnected data. In SQL, \"find all people within 3 hops of Alice\" requires recursive CTEs and explodes with depth; the optimizer doesn't always generate good plans. In Cypher:</p><pre>MATCH (alice)-[:KNOWS*1..3]-&gt;(p) RETURN p</pre><p>Graph DBs also let you mix edge types easily: FRIEND-OF, WORKS-AT, LIVED-IN. Relational schemas would need a join table per relationship type or a uni-table with a type column and ugly self-joins.</p><p>Real uses: social networks, fraud detection, recommendation, supply chains, knowledge graphs.</p>"}, {"q": "Compare MapReduce querying to SQL for analytics.", "diff": "medium", "a": "<p>MapReduce requires two hand-written functions (map + reduce) that must be pure. Pros: runs trivially on massive parallelism, works on any data format, handles giant data. Cons: verbose, easy to get wrong, hard to compose.</p><p>SQL is usually a better interface: it's declarative, composable, and the engine can often generate a MapReduce plan under the hood (Hive, Spark SQL). MongoDB even deprecated MapReduce in favor of an aggregation pipeline that's more SQL-like.</p><p>Takeaway: MapReduce is a <em>runtime</em>; SQL (and DSLs on top) is the better <em>interface</em>.</p>"}, {"q": "Give a scenario where you'd use polyglot persistence.", "diff": "hard", "a": "<p>E-commerce platform: <ul><li>PostgreSQL for core transactional data (orders, inventory, users) &mdash; ACID, relational integrity</li><li>Redis for session/cache &mdash; low latency</li><li>Elasticsearch for product search &mdash; full-text + facet</li><li>Neo4j for recommendations/social graph &mdash; multi-hop queries</li><li>S3 + Parquet + Spark for analytics &mdash; scale and columnar scans</li></ul>Each store is picked for its access pattern. Tradeoff: operational complexity, keeping systems in sync (topic of later chapters: CDC, stream processing).</p>"}]}, {"id": "ch3", "part": 1, "number": 3, "title": "Storage and Retrieval", "overview": "<p>How databases actually store and fetch bytes. The chapter contrasts two index/storage families: <strong>log-structured</strong> (SSTables + LSM-Trees, used by LevelDB, RocksDB, Cassandra, HBase) and <strong>update-in-place</strong> (B-Trees, used by InnoDB, Postgres, SQL Server).</p><p>Then pivots to the <strong>OLTP vs OLAP</strong> split &mdash; row-oriented transactional stores vs columnar analytical warehouses. Covers star/snowflake schemas, column compression (bitmap encoding, run-length), sort orders, and materialized views / data cubes.</p>", "concepts": [{"term": "Log-structured storage", "def": "Append-only data files. Writes are fast because they're sequential. Reads require an index. Deletes are tombstones.", "why": "Sequential writes are ~100&times; faster than random writes on HDD, and still much faster on SSD."}, {"term": "Hash index", "def": "In-memory hashmap of key &rarr; byte offset in an append-only file. Bitcask is the canonical example.", "why": "Fastest possible point-lookup. Limits: all keys must fit in RAM; range queries are inefficient."}, {"term": "SSTable (Sorted String Table)", "def": "A log file where key-value pairs are sorted by key. Enables efficient merge of files, range queries, and sparse in-memory indexes.", "why": "Foundation of LSM-Trees. Only the first key of every few KB needs to be in memory."}, {"term": "LSM-Tree (Log-Structured Merge)", "def": "Writes go to an in-memory <strong>memtable</strong>; when full, it's flushed as a sorted SSTable. SSTables are periodically merged/compacted in the background.", "why": "Fast writes (all sequential), good compression, and good space amplification &mdash; at cost of read amplification (must check multiple SSTables) and compaction overhead.", "ex": "LevelDB, RocksDB, Cassandra, HBase, Lucene."}, {"term": "Compaction", "def": "Background process that merges SSTables, discards overwritten keys and tombstones, and keeps SSTables sorted.", "why": "Essential for LSM reads to stay fast; also reclaims space. Can cause latency spikes if not tuned."}, {"term": "Bloom filter", "def": "Probabilistic set structure: tells you \"definitely not present\" or \"probably present\". Used in LSM-Trees to skip SSTables that can't contain a key.", "why": "Avoids expensive lookups across many SSTables with tiny memory overhead."}, {"term": "B-Tree", "def": "Balanced tree of fixed-size <em>pages</em> (typically 4 KB). Each lookup is O(log n) in page reads. Data is updated <em>in place</em>, which requires care for crash safety.", "why": "Classic workhorse of relational DBs for 40+ years. Great for reads (one disk seek per level) and balanced workloads."}, {"term": "Write-ahead log (WAL) / redo log", "def": "Append-only log of intended changes written <em>before</em> the B-tree is mutated. On crash, replay WAL to recover.", "why": "B-Tree page updates aren't atomic &mdash; WAL makes them crash-safe."}, {"term": "Clustered vs secondary index", "def": "<strong>Clustered</strong>: the primary index directly contains the row data. <strong>Secondary</strong>: points to a row ID; looking up the row is a second operation.", "why": "Clustered indexes reduce lookups for primary-key queries but make secondary-index lookups more expensive.", "ex": "InnoDB (MySQL) is clustered by primary key; Postgres heaps are unclustered; all indexes are secondary."}, {"term": "OLTP vs OLAP", "def": "<strong>OLTP</strong>: online transaction processing &mdash; small, indexed queries; user-facing; low latency. <strong>OLAP</strong>: online analytic processing &mdash; large scans, aggregations; analyst-facing; throughput-oriented.", "why": "They have opposite access patterns, driving different storage engines."}, {"term": "Data warehouse", "def": "A separate DB optimized for analytics. Data is copied there via ETL from OLTP systems.", "why": "Big analytic queries on the OLTP DB would starve transactional workloads. Separation lets each be optimized."}, {"term": "Star & snowflake schema", "def": "A central <strong>fact table</strong> (events) surrounded by <strong>dimension tables</strong> (who/what/where). Snowflake: dimensions are further normalized.", "why": "Standard analytics layout. Fact tables are huge; dimension tables are small."}, {"term": "Column-oriented storage", "def": "Store all values of one column contiguously (instead of all fields of one row). Typical of analytic warehouses (Parquet, ORC, Vertica, Redshift).", "why": "Analytic queries touch few columns but many rows &mdash; columnar reads only what's needed, and columns compress exceptionally well."}, {"term": "Column compression", "def": "Techniques like <strong>bitmap encoding</strong> (one bitmap per distinct value) and <strong>run-length encoding</strong> (RLE) exploit the repetition within a column.", "why": "10&ndash;100&times; compression is common; less I/O = faster scans; predicates can sometimes run directly on compressed data (vectorized)."}, {"term": "Sort order in columns", "def": "Picking a sort key (e.g., date) makes range scans on that column fast and improves RLE on the sorted column.", "why": "One sort key; some systems keep multiple sort orders in different replicas (C-Store/Vertica)."}, {"term": "Materialized view / data cube", "def": "Precomputed aggregate (e.g., sum(revenue) by country, day). A <em>data cube</em> is a multi-dimensional materialized summary.", "why": "Makes common dashboard queries sub-second; downside is write amplification and flexibility."}], "cheatsheet": [{"title": "LSM-Tree vs B-Tree", "type": "table", "headers": ["", "B-Tree", "LSM-Tree"], "rows": [["Writes", "In-place, random, slower; requires WAL", "Append + merge; fast sequential writes"], ["Reads", "Fast & predictable (one path)", "May check memtable + multiple SSTables; Bloom filters help"], ["Write amplification", "Moderate (page + WAL)", "Higher (repeated compactions)"], ["Space amp", "Fragmentation over time", "Better after compaction; tombstones linger briefly"], ["Compression", "Limited (page-level)", "Excellent (block-level in SSTables)"], ["Latency predictability", "Smooth", "Can spike during compaction"], ["Concurrency", "Mature (locks, MVCC)", "Simpler (append + merge)"], ["Examples", "Postgres, MySQL InnoDB, SQL Server", "RocksDB, LevelDB, Cassandra, HBase, Lucene"]]}, {"title": "OLTP vs OLAP", "type": "table", "headers": ["", "OLTP", "OLAP"], "rows": [["Access pattern", "Small # of rows per query, indexed", "Large scans, aggregations"], ["Users", "End users via apps", "Analysts, BI tools"], ["Data volume", "GB-TB (latest state)", "TB-PB (historical)"], ["Storage", "Row-oriented", "Column-oriented"], ["Workload", "Reads + writes mixed", "Mostly reads, bulk writes"], ["Examples", "Postgres, MySQL, Cassandra", "BigQuery, Snowflake, Redshift, ClickHouse"]]}, {"title": "Row-oriented vs Column-oriented", "type": "list", "items": ["<strong>Row-oriented</strong>: all fields of one record together &mdash; great for \"load one user and all their fields\"", "<strong>Column-oriented</strong>: all values of one field together &mdash; great for \"sum(revenue) across 100B rows\"", "Column store reads only the columns you SELECT", "Column store compresses dramatically (same-type, often sorted values)", "Writes are harder column-wise: LSM-like designs (e.g., C-Store's writeable store + merge) are used"]}], "interview": [{"q": "Explain LSM-Trees vs B-Trees and when you'd pick each.", "diff": "hard", "a": "<p><strong>B-Tree</strong>: fixed-size pages in a balanced tree. Writes update pages in place, protected by a WAL for crash safety. Reads are O(log n) with predictable latency. Mature concurrency (locking, MVCC).</p><p><strong>LSM-Tree</strong>: writes append to an in-memory memtable, which flushes to disk as a sorted SSTable. SSTables are merged by a background compaction process. Reads check memtable + SSTables (bloom filters help skip).</p><p><strong>LSM wins when</strong> writes are heavy (all sequential), compression matters, or you need high write throughput per node (Cassandra, HBase).</p><p><strong>B-Tree wins when</strong> you need predictable latency, strong transactional guarantees, or read-dominant workloads (Postgres, MySQL).</p><p>Modern LSM engines like RocksDB have narrowed the gap &mdash; many relational DBs now have LSM-based options (MyRocks).</p>"}, {"q": "Why is column-oriented storage better for analytics?", "diff": "medium", "a": "<p>Analytic queries typically scan a huge number of rows but only a few columns (SELECT country, SUM(revenue) FROM facts). Three wins:</p><ol><li><strong>Read only needed columns</strong>: I/O proportional to columns touched, not total row width. A 100-column table reading 3 columns is ~33&times; less I/O.</li><li><strong>Excellent compression</strong>: a column has uniform type and often low cardinality (e.g., country has ~200 values). Bitmap encoding, RLE, and dictionary encoding typically shrink 10&ndash;100&times;.</li><li><strong>Vectorized execution</strong>: CPU can process compressed bitmaps directly, SIMD-friendly.</li></ol><p>Downside: writes are harder (columns aren't co-located), so column stores use LSM-like layered designs.</p>"}, {"q": "What is a bloom filter and why do LSM-Trees use them?", "diff": "medium", "a": "<p>A bloom filter is a small, probabilistic set: it can say \"definitely not in set\" or \"probably in set\" with some false-positive rate, using ~10 bits per key for 1% FPR.</p><p>LSM reads may have to check multiple SSTables; a bloom filter per SSTable lets us skip SSTables that can't contain the key, avoiding expensive disk reads. False positives just cost a real lookup; false negatives don't happen.</p>"}, {"q": "Why do B-Trees need a write-ahead log?", "diff": "medium", "a": "<p>A B-Tree mutates pages in place. If you're in the middle of splitting a page and the machine crashes, you could leave the tree corrupted &mdash; an orphaned page, missing pointers, etc.</p><p>The <strong>WAL (aka redo log)</strong> is an append-only log of all planned page mutations. It's flushed before the page is modified. On crash, we replay the WAL to finish any incomplete operations. This makes the B-Tree durable and atomic despite non-atomic page writes.</p>"}, {"q": "What are clustered vs secondary indexes?", "diff": "easy", "a": "<p>A <strong>clustered index</strong> stores the full row data inside the index leaf, so a primary-key lookup returns the row in one operation. A <strong>secondary index</strong> stores a reference (row ID or primary key) that you follow to get the row.</p><p>MySQL InnoDB uses a clustered primary index: the table IS the B-tree on the primary key, and secondary indexes point to the PK (so they do an extra lookup). Postgres uses a heap file: all indexes are \"secondary\" (point to a tuple ID), which is simpler but requires a heap fetch per match.</p>"}, {"q": "Walk me through what happens when I insert a row into a Cassandra-style LSM database.", "diff": "hard", "a": "<ol><li>Append the write to the commit log (WAL) for durability.</li><li>Insert into the in-memory memtable (a balanced tree sorted by key).</li><li>Respond to the client.</li><li>When the memtable exceeds a threshold, flush it to disk as an immutable SSTable (sorted). A bloom filter and index are written alongside.</li><li>Periodically, a <strong>compaction</strong> process merges multiple SSTables into a larger one, dropping overwritten keys and tombstones.</li></ol><p>Reads must check the memtable, then the SSTables (from newest to oldest, using bloom filters to skip). This is why writes are fast and reads can be slower (<em>read amplification</em>) unless bloom filters and compaction keep SSTable count low.</p>"}, {"q": "What's a star schema and why is it used in warehouses?", "diff": "easy", "a": "<p>A big central <strong>fact table</strong> (one row per event: order, pageview, click) references several small <strong>dimension tables</strong> (date, product, customer, store). Named \"star\" because the fact table is in the center with dimensions around it.</p><p>It's used because analytic queries look like \"aggregate facts grouped by some dimensions with filters\" &mdash; a small number of joins, one huge table, several small ones. Fits column-oriented storage perfectly.</p><p><strong>Snowflake schema</strong>: dimensions are themselves normalized into sub-dimensions. More normalized, slightly more joins.</p>"}, {"q": "How do column stores handle updates efficiently?", "diff": "hard", "a": "<p>Naively, updating one cell in a column store requires rewriting the column. The standard solution (pioneered by C-Store / Vertica) is a two-tier design:</p><ul><li><strong>Writeable store</strong>: row-oriented (or LSM-like), accepts small writes fast.</li><li><strong>Read-optimized store</strong>: columnar, compressed, sorted.</li></ul><p>Periodically, the writeable tier is merged into the read tier &mdash; essentially LSM compaction, applied column-wise. Queries read from both and union.</p><p>Materialized views / data cubes are also common, precomputing aggregates so dashboards are sub-second.</p>"}, {"q": "Explain the tradeoff of materialized views.", "diff": "medium", "a": "<p>A materialized view stores the precomputed result of a query. Subsequent reads are instant; downsides:</p><ul><li><strong>Write amplification</strong>: every base-table change must update the view.</li><li><strong>Staleness</strong>: depending on refresh strategy (sync vs async), view may lag.</li><li><strong>Flexibility</strong>: only matches the views you precomputed; ad-hoc queries still hit base tables.</li></ul><p>Data cubes are a generalization: multi-dimensional summaries. Trade flexibility for speed.</p>"}]}, {"id": "ch4", "part": 1, "number": 4, "title": "Encoding and Evolution", "overview": "<p>Once data leaves memory or crosses a process boundary, it must be encoded (serialized). This chapter compares encoding formats &mdash; language-specific, JSON/XML, Thrift, Protocol Buffers, Avro &mdash; and their support for <strong>schema evolution</strong> (backward/forward compatibility).</p><p>Then three dataflow modes: through <strong>databases</strong> (writer is past-you, reader is future-you), through <strong>services</strong> (REST, RPC), and via <strong>asynchronous messages</strong> (brokers, actor model).</p><p>Central theme: long-lived systems have data from multiple code versions; formats must let old and new coexist peacefully.</p>", "concepts": [{"term": "Encoding / serialization", "def": "Converting in-memory data structures into bytes that can be written to disk or sent over a network (and the inverse: decoding/deserialization).", "why": "Every persistent or cross-process boundary needs this. The format dictates evolvability, size, and speed."}, {"term": "Language-specific encoding", "def": "Built-in serialization (Java Serializable, Python pickle, Ruby Marshal). Tied to one language, often insecure, hard to version.", "why": "Avoid for anything crossing process/service boundaries."}, {"term": "JSON, XML, CSV", "def": "Textual, human-readable, widely interoperable formats. Weak on types (JSON can't distinguish int from float reliably, no binary bytes, no consistent big-int).", "why": "Great for APIs and config; verbose and slow for bulk data."}, {"term": "Binary JSON variants", "def": "MessagePack, BSON, UBJSON: JSON-compatible but binary. Smaller but similar expressiveness.", "why": "Reasonable compromise when you like JSON but want size/speed."}, {"term": "Thrift & Protocol Buffers", "def": "Schema-first binary formats. You write an IDL (schema), generate code in many languages, and encode with explicit tag numbers.", "why": "Tag-based encoding is compact and supports schema evolution via optional fields and new tag numbers.", "ex": "Protobuf: message Person { int32 id = 1; string name = 2; }"}, {"term": "Avro", "def": "Schema-based binary format used heavily in Hadoop/Kafka. Unusually, writers and readers use (potentially different) schemas, and Avro resolves fields by <em>name</em> at read time.", "why": "Great for big data / stream processing: schema per file/topic, no tag numbers, smaller payloads, easy schema inference."}, {"term": "Backward compatibility", "def": "Newer code can read data written by older code.", "why": "Required to roll out new readers alongside old data."}, {"term": "Forward compatibility", "def": "Older code can read data written by newer code (usually by ignoring fields it doesn't know).", "why": "Required during rolling deploys: some services are already on the new version while others still send the old format."}, {"term": "Field tags", "def": "In Thrift/Protobuf, each field has a numeric tag. Encodings reference fields by tag, so renaming is cheap, but changing tags is a breaking change.", "why": "Enables both forward and backward compatibility: new fields get new tags and are ignorable by old readers; removed fields' tags must never be reused."}, {"term": "Writer's schema vs reader's schema (Avro)", "def": "Avro uses two schemas: the writer's (used to encode) and the reader's (used by the receiver to interpret). Avro matches fields by name and applies default values for missing ones.", "why": "Lets you evolve without tag numbers, and supports generic tools that process files of varying versions."}, {"term": "Schema registry", "def": "A service (e.g., Confluent Schema Registry) that holds every schema version. Messages embed a tiny schema ID; consumers fetch the schema when needed.", "why": "Essential for Avro-based streams; avoids embedding the full schema in every message."}, {"term": "Dataflow: through databases", "def": "Writer and reader are the same (or different) code, but decoupled by the DB. Old values may live for years; new code must read them.", "why": "Rolling upgrades + old rows => forward and backward compat both matter."}, {"term": "Dataflow: through services (REST/RPC)", "def": "Synchronous request/response over HTTP. <strong>REST</strong>: resource-based, uses HTTP semantics, schema-optional (OpenAPI/JSON Schema). <strong>RPC</strong>: make remote calls look like local ones (gRPC, Thrift).", "why": "REST wins on interoperability and web tooling; gRPC wins on efficiency and strongly-typed contracts."}, {"term": "Dataflow: async messaging", "def": "Via a message broker (RabbitMQ, Kafka, SQS) or the actor model. Producer sends, broker buffers, consumer processes. Decouples sender and receiver in time.", "why": "Resilience to transient faults, better buffering, easy to scale consumers."}, {"term": "Actor model", "def": "Concurrency model where \"actors\" send async messages to each other; each actor has its own state.", "why": "Natural fit for distributed systems where location can be transparent (Erlang/OTP, Akka)."}], "cheatsheet": [{"title": "Encoding formats compared", "type": "table", "headers": ["Format", "Self-describing?", "Schema evolution", "Size/speed", "Best fit"], "rows": [["JSON / XML", "Yes", "Manual, ad-hoc", "Verbose, slow", "APIs, interop, human-readable"], ["MessagePack / BSON", "Yes", "Like JSON", "Smaller than JSON", "JSON-drop-in binary"], ["Thrift / Protobuf", "No (schema required)", "Via tag numbers, optional fields", "Compact, fast", "Internal RPC, strong typing"], ["Avro", "No (writer & reader schemas)", "Name-based, excellent", "Very compact", "Big-data files, Kafka"]]}, {"title": "Schema evolution rules", "type": "list", "items": ["<strong>Adding a field</strong>: OK if optional with default &rarr; both forward & backward compat", "<strong>Removing a field</strong>: only remove optional fields; never reuse the tag", "<strong>Renaming</strong>: Thrift/Protobuf OK (tag is identity); Avro needs an alias", "<strong>Changing types</strong>: usually breaks compat; avoid or go through a new field", "<strong>Required &harr; optional</strong>: making required &rarr; optional is safe; the reverse is not"]}, {"title": "Dataflow modes", "type": "table", "headers": ["Mode", "Coupling", "Common formats", "Examples"], "rows": [["DB", "Temporal (data outlives schema)", "Anything; often DB-native", "Postgres, Cassandra"], ["Sync services (REST/RPC)", "Tight timing; loose lifecycle", "JSON over HTTP; Protobuf over gRPC", "Microservices"], ["Async messages", "Loose in time and space", "Avro, Protobuf, JSON", "Kafka, RabbitMQ, SQS"], ["Actor model", "Messages to addresses", "Binary, language-native", "Akka, Erlang"]]}], "interview": [{"q": "What is schema evolution and why does it matter?", "diff": "medium", "a": "<p>Schema evolution is the practice of changing a data schema over time without breaking existing writers or readers. It matters because:</p><ul><li><strong>Rolling deploys</strong>: during a deploy, old and new versions run simultaneously; each must read what the other writes.</li><li><strong>Data longevity</strong>: stored data outlives code. A Parquet file from 2019 must be readable by 2026 code.</li><li><strong>Team independence</strong>: different services evolve at different speeds; they shouldn't need lockstep upgrades.</li></ul><p>Good formats (Protobuf, Avro) make adding optional fields and ignoring unknown ones trivial; bad formats (language pickles) make evolution a manual minefield.</p>"}, {"q": "Compare Protobuf, Thrift, and Avro.", "diff": "hard", "a": "<p><strong>Protobuf & Thrift</strong>: schema-first IDLs with numeric <em>tag</em> per field. Encoding references fields by tag, so rename is free but tag change is a break. Adding an optional field with a new tag is fully backward + forward compatible. Tooling generates code in many languages.</p><p><strong>Avro</strong>: no tags; fields identified by name. Writers store (or reference) their schema; readers bring their own. Avro resolves field differences by name + defaults. Superb for big data: writes a single schema per file (not per record), yielding excellent compression ratios. Downsides: readers must know the writer schema (so a schema registry is common with Kafka).</p><p><strong>Tl;dr</strong>:</p><ul><li>Thrift/Protobuf: great for RPC, tag-based, strongly typed, widely supported in microservices.</li><li>Avro: great for Kafka/Hadoop, schema-based, compact for batched records, dynamic code less needed.</li></ul>"}, {"q": "Why is JSON a poor choice for large-scale data exchange?", "diff": "easy", "a": "<p>JSON is verbose, repeats every field name in every record, has weak type support (no distinct int/float, no bytes, big-int issues), and parsing is relatively slow. For APIs and configs it's great; for storing billions of records or high-throughput streams, binary formats like Protobuf or Avro are typically 3&ndash;10&times; smaller and much faster to parse.</p>"}, {"q": "What's the difference between backward and forward compatibility?", "diff": "easy", "a": "<p><strong>Backward compatibility</strong>: new code reads old data. Example: add a new optional field; v2 code reads v1 data just fine with the default.</p><p><strong>Forward compatibility</strong>: old code reads new data, typically by ignoring unknown fields. Example: v1 code receives a v2 message with an extra field; v1 ignores it.</p><p>Most systems need both simultaneously: during rolling deploys, every combination of versions must work in both directions.</p>"}, {"q": "How does Avro handle schema evolution if there are no field tags?", "diff": "hard", "a": "<p>Avro uses two schemas: the <strong>writer's</strong> (used to encode) and the <strong>reader's</strong> (used to interpret). Decoding performs schema resolution by matching fields by <em>name</em>:</p><ul><li>A field in the writer but not the reader &rarr; skipped.</li><li>A field in the reader but not the writer &rarr; filled with the reader's default.</li><li>Renamed fields can be handled via <em>aliases</em> in the reader schema.</li></ul><p>Writers either embed the schema (batch files do this once per file) or reference it via ID (streams use a schema registry). This makes per-record overhead tiny while preserving full evolvability.</p>"}, {"q": "Contrast REST and RPC. When would you pick each?", "diff": "medium", "a": "<p><strong>REST</strong>: resources with URLs, uses HTTP verbs (GET/POST/...), caching via HTTP headers, broad web tooling. Often JSON. Pro: interop, debuggable, cache-friendly. Con: less efficient, ad-hoc schemas.</p><p><strong>RPC</strong> (gRPC, Thrift): calls look like local method invocations, strongly typed, binary, streaming. Pro: efficient, great codegen, clear contract. Con: coupling of client/server versions, less web-friendly (though gRPC-Web exists).</p><p>Rule of thumb: use <strong>REST</strong> for public APIs and anything a third party consumes; use <strong>gRPC</strong> for internal microservice-to-microservice calls where efficiency matters and both sides are under your control.</p>"}, {"q": "Why are message brokers useful compared to direct service calls?", "diff": "medium", "a": "<p>Brokers decouple producers and consumers <em>in time</em> and <em>in space</em>:</p><ul><li>If the consumer is slow or down, messages buffer &mdash; producer isn't blocked.</li><li>Multiple consumers can subscribe to the same events (fan-out, replay).</li><li>Back-pressure: consumer reads at its own rate.</li><li>Operational: scale consumers independently.</li></ul><p>Good fit for event-driven systems and workflows where strict request/response coupling isn't needed. RPC still matters for synchronous user-blocking calls.</p>"}, {"q": "What goes wrong if you deploy code that writes a new required field, before upgrading readers?", "diff": "hard", "a": "<p>Old readers will fail to decode records containing the unknown field (if the format is strict) or &mdash; worse &mdash; silently ignore it (if lenient), losing important data downstream. If the new field is <em>required</em> in the reader schema, old writers emit records that fail new readers.</p><p>Correct rollout:</p><ol><li>Deploy schema change: field is <strong>optional with default</strong>.</li><li>Upgrade readers first (they now tolerate presence/absence).</li><li>Upgrade writers to emit the new field.</li><li>Only after backfill + confidence, mark the field required (if needed).</li></ol><p>This is why most schema-evolution guides say: never add required fields in one step, never remove fields in one step, and never reuse tag numbers.</p>"}]}, {"id": "ch5", "part": 2, "number": 5, "title": "Replication", "overview": "<p>Keeping copies of data on multiple nodes for <strong>availability, latency (locality), and read throughput</strong>. The chapter walks the three families of replication:</p><p><strong>Single-leader</strong> (one node accepts writes, followers replicate), <strong>multi-leader</strong> (multiple nodes accept writes, conflicts must be resolved), and <strong>leaderless</strong> (clients write to multiple nodes directly, read quorum merges results, a la Dynamo).</p><p>Key themes: synchronous vs asynchronous replication, replication lag and the anomalies it creates (read-your-writes, monotonic reads, consistent prefix), conflict resolution (LWW, version vectors, CRDTs), and the quorum math W+R &gt; N.</p>", "concepts": [{"term": "Why replicate?", "def": "Three reasons: (1) <strong>high availability</strong> despite node failure, (2) <strong>low latency</strong> by placing copies near users, (3) <strong>scaling reads</strong> via many replicas.", "why": "Replication only helps reads scale; writes must still hit all (or a quorum of) replicas."}, {"term": "Single-leader replication", "def": "One node is the leader/primary; all writes go there. It forwards a replication log to followers, which apply it.", "why": "Simple conceptually; avoids write conflicts (leader serializes all writes). Classic RDBMSs work this way.", "ex": "Postgres streaming replication, MySQL binlog, MongoDB, SQL Server Always On."}, {"term": "Synchronous vs asynchronous replication", "def": "<strong>Sync</strong>: leader waits for follower ack before returning. <strong>Async</strong>: leader returns immediately, followers catch up in the background.", "why": "Sync = durability + consistency but availability tanks if a follower is slow; async = availability but potential data loss on leader failure. Most systems use one sync + rest async (semi-sync)."}, {"term": "Failover", "def": "Promoting a follower when the leader fails. Must: detect failure (heartbeats), choose a new leader (consensus or admin decision), reconfigure writes.", "why": "The tricky part is \"what about writes the old leader had but didn't replicate?\" (loss), \"what if old leader comes back thinking it's still leader?\" (split brain)."}, {"term": "Replication log types", "def": "Three kinds: <strong>statement-based</strong> (ship SQL; brittle with NOW()/RAND()), <strong>WAL shipping</strong> (ship byte-level changes; couples to storage format), <strong>logical (row-based) log</strong> (high-level row changes; decoupled).", "why": "Logical logs enable heterogeneous replication &mdash; a core building block for CDC and stream processing."}, {"term": "Replication lag", "def": "Followers trail the leader by some delay. Small normally; can blow up under load or after outage.", "why": "Source of subtle read anomalies if the application reads from a follower."}, {"term": "Read-your-writes consistency", "def": "After you write X, your own next read must see X (or newer). Often required by UX.", "why": "Without it, user submits a comment, reloads, and doesn't see it &rarr; confusing bug.", "ex": "Implementations: route reads to leader for N seconds after a write; or track user's last write timestamp/position."}, {"term": "Monotonic reads", "def": "A single user never sees time go backward across successive reads.", "why": "Without it: user refreshes twice, second refresh goes to an older follower, sees a comment disappear.", "ex": "Pin each user to one replica (hash by user ID)."}, {"term": "Consistent prefix reads", "def": "If a sequence of writes happens in some order, readers see them in that order (or a consistent prefix of it).", "why": "Partitioned systems can observe cause-and-effect events out of order across partitions; a real example Kleppmann gives is question-then-answer appearing reversed.", "ex": "Solution: keep causally related writes on one partition, or use total ordering."}, {"term": "Multi-leader replication", "def": "Multiple nodes accept writes; each leader forwards its writes to all other leaders. Writes can happen anywhere.", "why": "Good for multi-datacenter, offline clients (laptop, phone), collaborative editing. Cost: write conflicts.", "ex": "CouchDB, BDR, clients that sync (Dropbox-like)."}, {"term": "Write conflicts", "def": "Two leaders accept conflicting writes to the same record; replication discovers the conflict after the fact.", "why": "Fundamental cost of multi-leader. Must pick a resolution strategy."}, {"term": "Conflict resolution strategies", "def": "<strong>Last-Write-Wins (LWW)</strong>: pick by timestamp &mdash; lossy. <strong>Custom merge</strong> (app logic). <strong>Avoid conflicts</strong> (route each record's writes to one leader). <strong>CRDTs</strong>: data types that mathematically merge.", "why": "LWW is easy but loses data. CRDTs (like OR-sets, counters) are correct by construction but have shape constraints."}, {"term": "Multi-leader topologies", "def": "<strong>All-to-all</strong> (each leader to every other), <strong>circular</strong>, <strong>star</strong>. All-to-all needs causal ordering (e.g., via version vectors) to avoid apply-before-arrival.", "why": "Star/circular are simpler but create single points of failure and longer propagation paths."}, {"term": "Leaderless replication", "def": "Clients write to <em>multiple</em> replicas simultaneously; reads fetch from multiple and reconcile. No leader.", "why": "Tolerates failure of any subset without failover dance. Conflicts are normal, not exceptional.", "ex": "Amazon Dynamo, Cassandra, Riak, Voldemort."}, {"term": "Quorum (W + R > N)", "def": "If a write must reach W nodes and a read must reach R nodes out of N replicas, and W + R > N, any read quorum overlaps with any write quorum.", "why": "Guarantees a read sees at least one copy of the latest write &mdash; the fundamental Dynamo-style correctness rule."}, {"term": "Read repair & anti-entropy", "def": "Detect and fix stale replicas. <strong>Read repair</strong>: during a read, push the latest value to stragglers. <strong>Anti-entropy</strong>: a background process compares and reconciles.", "why": "Without these, a rarely-read record stays stale forever."}, {"term": "Sloppy quorum & hinted handoff", "def": "If network partitions prevent reaching the \"home\" N nodes, a sloppy quorum writes to any N reachable nodes. When nodes rejoin, the \"handoff\" pushes data back home.", "why": "Increases availability for writes but weakens the quorum correctness &mdash; you might not read your own writes."}, {"term": "Concurrent writes / version vectors", "def": "Two clients can write \"at the same time\" (neither is causally before the other). A <strong>version vector</strong> captures the causal history: a per-replica counter vector.", "why": "Lets the system detect concurrent writes and either merge or surface conflict to the app. Used by Dynamo-like systems."}, {"term": "CRDTs (Conflict-free Replicated Data Types)", "
